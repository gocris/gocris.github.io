<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="apple-mobile-web-app-title" content="NEURAL_OS">
    <title>VALEO // CORSAIR DATA INPUT</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;900&family=Noto+Sans+JP:wght@300;500;700&display=swap');

        :root {
            --crimson: #ff1e46;
            --blood-glow: rgba(255, 30, 70, 0.5);
            --violet: #9d00ff;
            --bright-purple: #d884ff; 
            --cyan: #00f3ff;
            --gold: #ffea00;
            --void-purple: #120322;
            --bg-deep: #020104;
            --glass-bg: rgba(12, 5, 18, 0.7);
            --glass-border: rgba(157, 0, 255, 0.2);
            --text-main: #f0e6fa;
            --text-muted: #b8a6d4; 
            --font-en: 'Rajdhani', sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
            --font-jp: 'Noto Sans JP', sans-serif;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: var(--bg-deep); color: var(--text-main);
            display: flex; flex-direction: column; align-items: center; 
            overflow-x: hidden; position: relative; font-family: var(--font-en);
            overscroll-behavior-y: none;
        }

        @keyframes system-shock {
            0% { filter: drop-shadow(8px 0 0 var(--crimson)) drop-shadow(-8px 0 0 var(--violet)); transform: translate(3px, 3px); }
            50% { filter: drop-shadow(-8px 0 0 var(--crimson)) drop-shadow(8px 0 0 var(--violet)); transform: translate(-3px, -3px); }
            100% { filter: none; transform: translate(0, 0); }
        }
        .shock { animation: system-shock 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }

        #bootScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; display: flex; flex-direction: column; justify-content: center;
            padding: 30px; font-family: var(--font-mono); color: var(--crimson);
            box-sizing: border-box; overflow: hidden; pointer-events: none;
            transition: opacity 0.5s ease-out, filter 0.5s ease-out;
        }
        .boot-line { font-size: 0.9rem; margin-bottom: 5px; text-shadow: 0 0 5px var(--crimson); opacity: 0; }

        #particleCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

        /* --- THE HOLOGRAPHIC FLOATING CAPYBARA (DARK PURPLE GLOW) --- */
        .flying-capy {
            position: fixed; left: -150px; z-index: 4; width: 110px; height: auto; opacity: 0;
            pointer-events: none; filter: drop-shadow(0 0 15px rgba(130, 0, 200, 0.8));
            mix-blend-mode: screen; /* Deletes black backgrounds automatically */
            user-select: none;
        }
        .capy-active { animation: capy-float 12s ease-in-out forwards; }
        @keyframes capy-float {
            0% { transform: translate(-100px, 0) rotate(-5deg); opacity: 0; }
            10% { opacity: 0.85; }
            25% { transform: translate(25vw, -30px) rotate(5deg); }
            50% { transform: translate(50vw, 20px) rotate(-3deg); }
            75% { transform: translate(75vw, -20px) rotate(4deg); }
            90% { opacity: 0.85; }
            100% { transform: translate(120vw, 10px) rotate(0deg); opacity: 0; }
        }

        .corsair-mark {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 40vw; color: rgba(255, 30, 70, 0.02); z-index: 2;
            pointer-events: none; text-shadow: 0 0 60px rgba(157, 0, 255, 0.05);
            animation: phantom-pulse 6s infinite alternate ease-in-out; font-family: monospace;
        }
        @keyframes phantom-pulse { 
            0% { opacity: 0.2; filter: blur(8px); transform: translate(-50%, -50%) scale(0.98); } 
            100% { opacity: 1; filter: blur(12px); transform: translate(-50%, -50%) scale(1.02); } 
        }

        body::before { content: ""; position: fixed; top: -20%; left: -20%; width: 80vw; height: 80vw; background: radial-gradient(circle at center, rgba(157, 0, 255, 0.08) 0%, transparent 60%); z-index: 3; pointer-events: none; }
        body::after { content: ""; position: fixed; bottom: -20%; right: -20%; width: 80vw; height: 80vw; background: radial-gradient(circle at center, rgba(255, 30, 70, 0.06) 0%, transparent 60%); z-index: 3; pointer-events: none; }

        .ui-layer { position: relative; z-index: 10; display: flex; flex-direction: column; width: 100%; max-width: 480px; height: 100vh; box-sizing: border-box; padding-bottom: 40px; }
        .header { background: rgba(12, 5, 18, 0.85); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255, 30, 70, 0.3); padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 20px rgba(0,0,0,0.8); flex-shrink: 0; }
        .btn-sys-back { background: rgba(255, 30, 70, 0.1); border: 1px solid var(--crimson); color: var(--crimson); font-family: var(--font-en); font-weight: 700; font-size: 0.85rem; letter-spacing: 2px; text-decoration: none; padding: 6px 12px; border-radius: 2px; transition: all 0.3s ease; box-shadow: 0 0 10px rgba(255, 30, 70, 0.2); }
        .btn-sys-back:hover { background: var(--crimson); color: #000; box-shadow: 0 0 15px var(--crimson); }
        .header-title { font-family: var(--font-en); font-weight: 900; font-size: 1.2rem; letter-spacing: 3px; color: #fff; text-shadow: 0 0 10px rgba(157, 0, 255, 0.5); margin-left: 10px; transition: opacity 0.3s ease; }
        select { background: rgba(5, 2, 10, 0.9); color: var(--crimson); border: 1px solid var(--crimson); font-family: var(--font-en); font-weight: 700; font-size: 0.8rem; padding: 6px; outline: none; border-radius: 2px; box-shadow: 0 0 10px rgba(255, 30, 70, 0.2); }

        /* --- UNIFIED TACTICAL TELEMETRY BAR --- */
        .payload-container { 
            width: 100%; height: 32px; background: rgba(5, 2, 8, 0.9); 
            border-bottom: 1px solid rgba(157, 0, 255, 0.3); flex-shrink: 0; 
            position: relative; overflow: hidden; display: flex; align-items: center; 
        }
        .payload-fill { 
            position: absolute; left: 0; top: 0; height: 100%; width: 0%; 
            background: var(--crimson); box-shadow: 0 0 15px var(--crimson); 
            transition: width 0.4s cubic-bezier(0.25, 1, 0.5, 1), background-color 0.3s ease, box-shadow 0.3s ease; z-index: 1; overflow: hidden; 
        }
        .payload-fill::after { 
            content: ""; position: absolute; top: 0; left: -100%; width: 60%; height: 100%; 
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8), transparent); 
            animation: payload-sweep 1.2s infinite linear; 
        }
        @keyframes payload-sweep { 0% { left: -100%; } 100% { left: 200%; } }

        .s-level-wrapper { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: flex; z-index: 2; pointer-events: none; }
        .s-segment { flex: 1; display: flex; align-items: center; justify-content: flex-start; padding-left: 12px; border-right: 1px solid rgba(157, 0, 255, 0.2); opacity: 0.35; transition: all 0.3s ease; box-sizing: border-box; }
        .s-segment:last-child { border-right: none; }
        .s-segment span { font-family: var(--font-mono); font-size: 0.85rem; font-weight: bold; color: var(--text-muted); letter-spacing: 2px; text-shadow: 0 0 5px #000; transition: all 0.3s ease; display: flex; align-items: center; }
        
        .s-segment.active { opacity: 1; background: linear-gradient(90deg, var(--dynamic-glow, rgba(216, 132, 255, 0.2)) 0%, transparent 90%); border-left: 2px solid var(--dynamic-color, var(--bright-purple)); box-shadow: inset 5px 0 15px -5px var(--dynamic-color, var(--bright-purple)); }
        .s-segment.active span { color: #fff; text-shadow: 0 0 8px var(--dynamic-color, var(--bright-purple)), 0 0 15px var(--dynamic-color, var(--bright-purple)); font-size: 0.95rem; }
        .s-segment.active span::before { content: "»"; color: var(--dynamic-color, #39ff14); text-shadow: 0 0 10px var(--dynamic-glow, rgba(57, 255, 20, 0.8)); margin-right: 6px; font-size: 1.1rem; animation: pulse-arrow 0.8s infinite alternate ease-in-out; }
        
        @keyframes pulse-arrow { 0% { opacity: 0.4; transform: translateX(-3px); } 100% { opacity: 1; transform: translateX(3px); } }

        .payload-text { 
            position: absolute; right: 15px; z-index: 5; font-family: var(--font-mono); 
            font-size: 1.1rem; font-weight: 900; color: #fff; 
            text-shadow: 0px 0px 4px #000, 0px 0px 6px #000, 0 0 10px var(--crimson); 
            letter-spacing: 2px; pointer-events: none; 
        }

        .status-bar { background: rgba(8, 2, 15, 0.9); color: #fff; text-align: center; padding: 10px 15px; font-family: var(--font-mono); font-weight: bold; font-size: 0.85rem; border-bottom: 1px solid rgba(157,0,255,0.4); text-transform: uppercase; letter-spacing: 1px; flex-shrink: 0; text-shadow: 0 0 5px rgba(157,0,255,0.5); transition: color 0.3s ease; }
        
        .display-area { flex: 1; display: flex; flex-direction: column; padding: 15px; background: rgba(5, 2, 10, 0.65); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255,255,255,0.05); overflow-y: auto; }
        .history-log { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; font-family: var(--font-mono); color: var(--text-muted); font-size: 0.85rem; line-height: 1.6; margin-bottom: 10px; }
        .history-item { margin-bottom: 6px; padding-left: 8px; border-left: 2px solid; animation: fade-up 0.2s ease-out forwards; transition: border-color 0.3s ease; }
        .history-skip { color: #888; font-style: italic; border-left: 2px solid rgba(255, 255, 255, 0.2) !important; }
        
        .phase-boundary { width: 100%; text-align: center; border-top: 1px dashed var(--violet); border-bottom: 1px dashed var(--violet); color: var(--bright-purple); padding: 10px 0; margin: 15px 0; font-weight: 900; letter-spacing: 4px; background: rgba(216, 132, 255, 0.05); text-shadow: 0 0 10px rgba(216, 132, 255, 0.5); animation: fade-up 0.2s ease-out forwards; }
        @keyframes fade-up { 0% { opacity: 0; transform: translateY(5px); } 100% { opacity: 1; transform: translateY(0); } }

        /* --- THE CYBERPUNK INSERTION CURSOR --- */
        .current-input { 
            font-family: var(--font-mono); font-size: 2.8rem; color: var(--crimson); 
            text-shadow: 0 0 15px var(--blood-glow); text-align: right; 
            min-height: 55px; border-bottom: 2px solid var(--crimson); 
            margin-bottom: 5px; font-weight: bold; letter-spacing: 2px; position: relative;
            transition: color 0.3s ease, border-bottom-color 0.3s ease, text-shadow 0.3s ease;
        }
        .current-input.typing-active::after {
            content: '█';
            color: var(--cursor-color, var(--cyan));
            text-shadow: 0 0 10px var(--cursor-glow, rgba(0, 243, 255, 0.5));
            animation: cyber-cursor-blink 1s step-end infinite;
            margin-left: 8px;
            vertical-align: text-bottom;
            font-size: 2.4rem;
        }
        @keyframes cyber-cursor-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* CONDENSED 4x3 KEYPAD */
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: rgba(2, 1, 4, 0.95); padding: 10px; flex-shrink: 0; border-top: 1px solid rgba(157, 0, 255, 0.2); }
        
        .btn { background: rgba(18, 5, 30, 0.7); border: 1px solid rgba(255,255,255,0.03); border-left: 2px solid var(--violet); color: #fff; font-size: 1.8rem; padding: 16px 0; font-family: var(--font-en); font-weight: 700; touch-action: manipulation; transition: all 0.1s ease; position: relative; cursor: pointer; outline: none; border-radius: 2px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .btn:active, .btn.keyboard-active { background: var(--crimson) !important; color: #000 !important; text-shadow: none !important; box-shadow: 0 0 20px var(--crimson) !important; transform: scale(0.92); }
        @keyframes cyber-pulse { 0% { background-color: rgba(18, 5, 30, 0.7); color: rgba(240, 230, 250, 0.7); } 100% { background-color: rgba(30, 10, 50, 0.9); color: #ffffff; text-shadow: 0 0 10px var(--violet); } }
        .num-btn { animation: cyber-pulse 1.5s infinite alternate ease-in-out; }
        .btn-disabled { opacity: 0.12; pointer-events: none; filter: grayscale(100%); border-color: transparent !important; animation: none !important; color: #fff !important; background-color: rgba(10,10,12,0.5) !important; box-shadow: none !important; }
        
        /* --- CSS-ONLY EMOJI GLITCH OVERLAY --- */
        .num-btn::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: #120322; border-radius: 2px; pointer-events: none; opacity: 0;
            animation: emoji-glitch-cycle 30s infinite;
        }
        .num-btn::after {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.6rem; pointer-events: none; opacity: 0;
            filter: drop-shadow(0 0 8px var(--violet));
        }

        @keyframes emoji-glitch-cycle { 0%, 90% { opacity: 0; } 90.1%, 100% { opacity: 1; } }
        @keyframes emoji-glitch-blink-fast { 0%, 90% { opacity: 0; } 90.1%, 91.5%, 93.0%, 94.5%, 96.0%, 97.5%, 99.0% { opacity: 1; } 90.8%, 92.2%, 93.8%, 95.2%, 96.8%, 98.2%, 99.8%, 100% { opacity: 0; } }
        @keyframes emoji-glitch-blink-chaos { 0%, 90% { opacity: 0; } 90.1%, 92.5%, 93.1%, 96.5%, 98.1%, 99.5% { opacity: 1; } 91.5%, 92.8%, 95.0%, 97.2%, 98.8%, 100% { opacity: 0; } }

        .num-btn[data-key="1"]::after { content: '💀'; animation: emoji-glitch-cycle 30s infinite; }
        .num-btn[data-key="3"]::after { content: '👾'; animation: emoji-glitch-cycle 30s infinite; }
        .num-btn[data-key="5"]::after { content: '👁️'; animation: emoji-glitch-cycle 30s infinite; }
        .num-btn[data-key="6"]::after { content: '⚡'; animation: emoji-glitch-cycle 30s infinite; }
        .num-btn[data-key="8"]::after { content: '🔥'; animation: emoji-glitch-cycle 30s infinite; }
        .num-btn[data-key="0"]::after { content: '🏴‍☠️'; animation: emoji-glitch-cycle 30s infinite; }
        .num-btn[data-key="2"]::after { content: '👽'; animation: emoji-glitch-blink-fast 30s step-end infinite; }
        .num-btn[data-key="4"]::after { content: '🤖'; animation: emoji-glitch-blink-chaos 30s step-end infinite; }
        .num-btn[data-key="7"]::after { content: '☢️'; animation: emoji-glitch-blink-fast 30s step-end infinite; }
        .num-btn[data-key="9"]::after { content: '🩸'; animation: emoji-glitch-blink-chaos 30s step-end infinite; }

        /* ACTION BUTTONS */
        .btn-action { font-size: 1.2rem; font-weight: 900; animation: none; color: #ffffff !important; text-shadow: 0 2px 4px rgba(0,0,0,0.8); transition: color 0.3s ease, font-size 0.3s ease; }
        .btn-undo { background: rgba(30, 5, 15, 0.8); border-left-color: var(--crimson); }
        .btn-enter { background: rgba(10, 30, 15, 0.8); border-left-color: #39ff14; }

        /* --- DYNAMIC THREAT STREAM -> ENCODE BUTTON --- */
        .threat-stream { 
            position: fixed; bottom: 0; left: 0; width: 100%; height: 40px; 
            background: rgba(5, 2, 8, 0.95); border-top: 1px solid var(--crimson); 
            font-family: monospace; font-size: 0.7rem; color: var(--crimson); 
            display: flex; align-items: center; justify-content: flex-start;
            padding: 0 15px; box-sizing: border-box; z-index: 50; overflow: hidden; 
            white-space: nowrap; box-shadow: 0 0 20px rgba(255, 30, 70, 0.2); 
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: default;
        }
        .stream-content { opacity: 0.7; letter-spacing: 1px; }

        .threat-stream.encode-ready {
            background: var(--crimson); color: #000; font-family: var(--font-en); font-size: 1.4rem;
            font-weight: 900; justify-content: center; letter-spacing: 4px; cursor: pointer;
            box-shadow: 0 0 30px var(--blood-glow); height: 70px;
            padding-bottom: max(10px, env(safe-area-inset-bottom)); border-top: none;
        }
        .threat-stream.encode-ready:active { transform: scale(0.98); background: #fff; }
        .threat-stream.encode-ready .stream-content { opacity: 1; }

        /* --- 3D KINETIC MENU BUTTON (GOLD ONLY FOR PHASE 2) --- */
        .menu-btn { width: 100%; max-width: 380px; height: 110px; background: rgba(15, 5, 20, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.02); border-right: 1px solid rgba(255, 234, 0, 0.2); border-radius: 2px; color: var(--text-main); font-family: var(--font-en); cursor: pointer; margin: 0 auto; position: relative; overflow: hidden; transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease, background 0.3s ease; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding: 0 35px; text-align: left; transform-style: preserve-3d; }
        .menu-btn::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--gold); transition: width 0.3s ease, box-shadow 0.3s ease; box-shadow: 0 0 20px var(--gold); }
        .menu-btn::after { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at left center, rgba(255, 234, 0, 0.15) 0%, transparent 70%); opacity: 1; transition: opacity 0.4s ease; pointer-events: none; }
        .menu-btn:hover, .menu-btn:active { background: rgba(25, 20, 5, 0.95); border-color: rgba(255, 234, 0, 0.4); transform: translateY(-2px) scale(0.98) rotateX(2deg); box-shadow: 0 20px 40px rgba(0,0,0,0.9), inset 0 0 20px rgba(255,234,0,0.1); }
        .menu-btn .btn-title { font-size: 1.5rem; font-weight: 900; letter-spacing: 3px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); color: var(--gold); }
        .btn-jp { font-family: var(--font-jp); font-size: 0.75rem; font-weight: 500; color: #fff; letter-spacing: 5px; margin-top: 6px; text-transform: uppercase; opacity: 0.8; }

        /* --- QR / AI DIAGNOSTIC MODAL --- */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(2, 1, 4, 0.95); backdrop-filter: blur(15px); z-index: 100; flex-direction: column; align-items: center; justify-content: flex-start; padding: 50px 20px 20px 20px; box-sizing: border-box; overflow-y: auto; }
        
        .qr-container { background: white; padding: 15px; border-radius: 2px; box-shadow: 0 0 30px var(--blood-glow); margin: 20px auto; border: 4px solid var(--crimson); display: flex; justify-content: center; align-items: center; }
        .qr-morph-wrapper { position: relative; width: 240px; height: 240px; display: flex; justify-content: center; align-items: center; }
        #cuteSkull { position: absolute; z-index: 2; width: 140px; height: 140px; filter: drop-shadow(0 0 15px var(--crimson)); opacity: 1; transform: scale(1); }
        #qrCanvas { position: absolute; z-index: 1; opacity: 0; filter: blur(10px); transform: scale(0.8); }
        .morph-active #cuteSkull { animation: morph-out 0.8s cubic-bezier(0.5, 0, 0.2, 1) forwards; }
        .morph-active #qrCanvas { animation: morph-in 0.8s cubic-bezier(0.5, 0, 0.2, 1) forwards; }
        @keyframes morph-out { 0% { transform: scale(1) rotate(0deg); opacity: 1; filter: drop-shadow(0 0 15px var(--crimson)) blur(0px); } 50% { transform: scale(1.3) rotate(15deg); opacity: 0.8; filter: drop-shadow(0 0 30px var(--violet)) blur(4px); } 100% { transform: scale(0.1) rotate(45deg); opacity: 0; filter: blur(20px); } }
        @keyframes morph-in { 0% { opacity: 0; filter: blur(20px) contrast(5); transform: scale(0.8); } 50% { opacity: 0.5; filter: blur(4px) contrast(2); transform: scale(1.05); } 100% { opacity: 1; filter: blur(0) contrast(1); transform: scale(1); } }

        /* --- AI TYPO DIAGNOSTICS UI --- */
        #aiConsoleWrapper { width: 100%; max-width: 420px; font-family: var(--font-mono); font-size: 0.9rem; margin-bottom: 20px; display: none; }
        .ai-diagnostic { background: rgba(5, 1, 10, 0.9); border: 1px solid var(--violet); border-left: 4px solid var(--violet); padding: 20px; box-shadow: inset 0 0 30px rgba(0,0,0,0.9); text-align: left; position: relative; }
        .ai-title { font-weight: 900; letter-spacing: 2px; border-bottom: 1px dashed rgba(157,0,255,0.5); padding-bottom: 8px; margin-bottom: 15px; }
        .ai-line { margin-bottom: 8px; opacity: 0; animation: fade-in 0.1s forwards; }
        .ai-success { color: #39ff14; font-weight: bold; text-shadow: 0 0 10px rgba(57, 255, 20, 0.4); }
        .ai-minor { color: var(--bright-purple); font-weight: bold; text-shadow: 0 0 10px rgba(216, 132, 255, 0.4); }
        .ai-extreme { color: var(--crimson); font-weight: bold; text-shadow: 0 0 10px rgba(255, 30, 70, 0.4); }
        .ai-list { margin: 5px 0 15px 15px; padding: 0; color: #b8a6d4; font-size: 0.8rem; }
        
        .typo-box { background: rgba(20, 5, 5, 0.8); border: 1px solid var(--crimson); padding: 15px; margin-top: 15px; }
        .typo-label { color: var(--crimson); font-weight: bold; font-size: 0.8rem; letter-spacing: 1px; margin-bottom: 10px; }
        .typo-input-group { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .typo-input { background: rgba(0,0,0,0.5); border: 1px solid var(--violet); color: var(--bright-purple); font-family: var(--font-mono); font-size: 1.2rem; font-weight: bold; width: 80px; text-align: center; padding: 5px; outline: none; }
        .typo-input:focus { border-color: var(--bright-purple); box-shadow: 0 0 15px rgba(216, 132, 255, 0.3); }

        .btn-ai-action { 
            width: 100%; padding: 14px; margin-top: 10px; background: rgba(10, 2, 15, 0.8); 
            font-family: var(--font-en); font-weight: bold; font-size: 1.1rem; letter-spacing: 2px; 
            cursor: pointer; border: 1px solid rgba(255,255,255,0.05); transition: all 0.2s; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); position: relative; overflow: hidden;
        }

<script>

    // --- CYBERPUNK RAINBOW CASCADE ARRAYS ---

        'rgba(255, 30, 70, 0.5)',   // Crimson

        'rgba(0, 243, 255, 0.5)',   // Cyan
        'rgba(157, 0, 255, 0.5)',   // Indigo/Violet
        'rgba(216, 132, 255, 0.5)'  // Bright Purple
    ];

    // --- MEMORY BANK SYSTEM ---
    function saveLocalState() {
        const mode = document.getElementById('modeSelector').value;
        localStorage.setItem('valeo_data_' + mode, JSON.stringify(dataList));
    }

        const mode = document.getElementById('modeSelector').value;
        const saved = localStorage.getItem('valeo_data_' + mode);
        if (saved) {
            try { dataList = JSON.parse(saved); } catch(e) { dataList = []; }

            dataList = [];

        currentString = "";
    }

    // --- HOLD TO PURGE MECHANIC ---
    let purgeTimer = null;
    let isPurging = false;
    
    function startPurge(e) {
        const btn = document.getElementById('btnUndo');
        btn.style.color = "var(--crimson)";
        purgeTimer = setTimeout(() => {
            isPurging = true;
            dataList = [];
            currentString = "";
            saveLocalState();
            updateDisplay();
            triggerShockwave();

                btn.innerText = "UNDO";

            btn.style.color = "#ffffff";
        }
    }
    
    function handleUndoClick() {
        if (isPurging) { 
            isPurging = false; 
            return;

    // --- UNDO GHOST LABEL CYCLE ---

            setTimeout(() => {

                setTimeout(() => {
                    undoBtn.innerText = "UNDO";

                    undoBtn.style.color = "#ffffff";
                    undoBtn.style.opacity = '1';
                }, 300);
            }, 3000);
        }, 300);
    }, 25000);

    // RE-ADDED URL PARSING FOR ROUTING
    const urlParams = new URLSearchParams(window.location.search);
    const modeParam = urlParams.get('mode');
    if (modeParam && ['T1', 'T2', 'T3', 'FREE'].includes(modeParam)) {
        document.getElementById('modeSelector').value = modeParam;
    }

    // INITIALIZATION ROOT CALL
    window.onload = () => { 
        changeMode(); 
        setTimeout(() => { 
            document.getElementById('bootScreen').style.opacity = '0'; 
            document.getElementById('bootScreen').style.filter = 'blur(10px)'; 
        }, 1100); 
    };

    let dataList = [];
    let currentString = "";
    let isAutoSkipping = false;
    let isSubmitting = false; 
    let scrambleInterval = null;
    let failedZonesTracker = []; 
    let showTolerance = false;
    let isEncodeReady = false;
    
    function toggleTolerance() { showTolerance = !showTolerance; checkBlueprint(); }
    
    function handleStreamClick() {
        if (isEncodeReady || !activeBlueprint) triggerEncoding();
    }
    
    const template1 = ['A','B', 'A','B', 'A','B', 'A','B', 'A','B', 'A','B', 'P', 'C','D', 'C','D', 'C','D', 'C','D', 'C','D', 'C','D'];
    const template2 = ['A','B','X', 'A','B','X', 'A','B','X', 'A','B','X', 'A','B','X', 'A','B','X', 'A','B','X', 'A','B','-', 'A','-', 'A','-', 'A','X','-','-', 'A','B','X', 'A','B','X', 'A','B','X', 'A','B','X', 'A','B','X', 'A','B','X', 'A','B','X', 'A','B','-', 'A','-', 'A','-', 'A','X','-','-'];
    const template3 = ['K','A','B','A','B','C','D','C','D','E','F','E','F','J','K','A','B','A','B','C','D','C','D','E','F','E','F','J','K','A','B','A','B','C','D','C','D','E','F','E','F','J'];

    const t1Labels = ["S1 QR", "S1 NQR", "S5 QR", "S5 NQR", "S7/8 QR", "S7/8 NQR"];
    const t2Labels = ["QR SIDE - A1", "QR SIDE - A2", "QR SIDE - B1", "QR SIDE - B2", "QR SIDE - B3", "QR SIDE - B4", "QR SIDE - C", "QR SIDE - D", "QR SIDE - E1", "QR SIDE - E2", "QR SIDE - W", "BACK SIDE - A1", "BACK SIDE - A2", "BACK SIDE - B1", "BACK SIDE - B2", "BACK SIDE - B3", "BACK SIDE - B4", "BACK SIDE - C", "BACK SIDE - D", "BACK SIDE - E1", "BACK SIDE - E2", "BACK SIDE - W"];
    const t3Names = ["Left Edge", "Slot 1 (QR)", "Slot 2 (QR)", "Slot 1 (Back)", "Slot 2 (Back)", "Slot 16 (QR)", "Slot 17 (QR)", "Slot 16 (Back)", "Slot 17 (Back)", "Slot 27 (QR)", "Slot 28 (QR)", "Slot 27 (Back)", "Slot 28 (Back)", "Right Edge"];

    const regexRulesT1 = { 'A': /^(5|5[0-9]|5[0-9]\.|5[0-9]\.[0-9]{0,2})$/, 'B': /^([4-7]|[4-7]\.|[4-7]\.[0-9]{0,2})$/, 'C': /^(8|9|8[0-9]|9[0-5]|8[0-9]\.|9[0-5]\.|8[0-9]\.[0-9]{0,2}|9[0-5]\.[0-9]{0,2})$/, 'D': /^(8|9|8[0-9]|9[0-5]|8[0-9]\.|9[0-5]\.|8[0-9]\.[0-9]{0,2}|9[0-5]\.[0-9]{0,2})$/ };

    let activeBlueprint = template1;

        const val = document.getElementById('modeSelector').value;

        if (val === 'T1' || val === 'T3') document.getElementById('sLevelWrapper').style.display = 'flex';
        else document.getElementById('sLevelWrapper').style.display = 'none';

        loadLocalState(); 
        updateDisplay();
    }

    function triggerShockwave() {
        const body = document.getElementById('mainBody');
        body.classList.remove('shock'); void body.offsetWidth; body.classList.add('shock');
        setTimeout(() => { body.classList.remove('shock'); }, 250);
    }

    function scrambleInputDisplay() {
        const el = document.getElementById('currentInput'); const hexChars = "ABCDEF0123456789"; let ticks = 0;
        clearInterval(scrambleInterval);
        scrambleInterval = setInterval(() => {
            el.innerText = currentString.split('').map(c => (c === '.') ? '.' : hexChars[Math.floor(Math.random() * hexChars.length)]).join('');
            ticks++; if(ticks > 3) { clearInterval(scrambleInterval); el.innerText = currentString; scrambleInterval = null; }
        }, 30);
    }

    function updateDisplay() {
        const el = document.getElementById('currentInput');
        if (!scrambleInterval || currentString === "") { el.innerText = currentString; }
        
        let html = "";
        dataList.forEach((item, index) => {
            // Alternating History Row Colors (Bright Purple vs Pale Neon Lavender)
            let altColor = (index % 2 === 0) ? "var(--bright-purple)" : "#f3ccff";
            let altGlow = (index % 2 === 0) ? "rgba(216, 132, 255, 0.4)" : "rgba(243, 204, 255, 0.4)";

            if (item === 'X') html += `<div class="history-item history-skip" style="border-left-color: ${altColor}; color: ${altColor};">> JUMP SECURED: +3 CELLS</div>`;
            else if (item === '-') html += `<div class="history-item history-skip" style="border-left-color: ${altColor}; color: ${altColor};">> JUMP SECURED: +1 CELL</div>`;
            else if (item === 'P') html += `<div class="phase-boundary">// PHASE 1 COMPLETE //</div>`;
            else {
                let varName = ""; let expectedVar = activeBlueprint ? activeBlueprint[index] : null;
                const mode = document.getElementById('modeSelector').value;
                if (mode === 'T1') {
                    let zoneIdx = 0; if (index < 12) zoneIdx = Math.floor(index / 2); else if (index > 12) zoneIdx = Math.floor((index - 13) / 2);

                    if(expectedVar === 'A') varName = `[${zName}] Total(mg)`; else if(expectedVar === 'B') varName = `[${zName}] Samp(mg)`; else if(expectedVar === 'C') varName = `[${zName}] 2nd Tg`; else if(expectedVar === 'D') varName = `[${zName}] 3rd Tg`;
                } else if (mode === 'T2') {
                    if(expectedVar === 'A') varName = "Braze Length"; else if(expectedVar === 'B') varName = "Porosity Total";
                } else if (mode === 'T3') { varName = t3Names[index % 14]; }
                if (varName === "") varName = `VAL_${index+1}`;
                let dispItem = item; if (mode === 'T3' && !dispItem.startsWith('.')) dispItem = '.' + dispItem;
                
                html += `<div class="history-item" style="border-left-color: ${altColor};">> OVERRIDE <span style="color: ${altColor}; text-shadow: 0 0 5px ${altGlow};">[ ${varName} ]</span> <span style="color: #fff;">${dispItem}</span> <span style="color: #39ff14; text-shadow: 0 0 10px rgba(57, 255, 20, 0.5);">... OK</span></div>`;
            }
        });
        document.getElementById('historyLog').innerHTML = html;
        const displayArea = document.getElementById('displayArea'); displayArea.scrollTop = displayArea.scrollHeight;
        
        saveLocalState();
        checkBlueprint();
    }

    // THE FLAWLESS, WORKING VALIDATION ENGINE 
    function checkBlueprint() {
        const numBtns = document.querySelectorAll('.num-btn'); 
        const btnEnter = document.getElementById('btnEnter'); 
        const statusBar = document.getElementById('statusBar'); 
        const payloadFill = document.getElementById('payloadFill'); 
        const payloadText = document.getElementById('payloadText'); 
        const mode = document.getElementById('modeSelector').value;
        const streamBar = document.getElementById('threatStreamBar');
        const curInputEl = document.getElementById('currentInput');
        const sLevelWrapper = document.getElementById('sLevelWrapper');

        numBtns.forEach(b => b.classList.remove('btn-disabled')); 
        if (btnEnter) btnEnter.classList.remove('btn-disabled');

        let canType = true;
        let curIdx = dataList.length;
        
        // Calculate the Rainbow Cursor Step
        let rColor = rainbowColors[curIdx % rainbowColors.length];
        let rGlow = rainbowGlows[curIdx % rainbowGlows.length];

        // Apply Rainbow to Cursor Only
        curInputEl.style.setProperty('--cursor-color', rColor);
        curInputEl.style.setProperty('--cursor-glow', rGlow);

        if (!activeBlueprint) { 
            statusBar.innerText = "SYSTEM: MANUAL OVERRIDE ACTIVE"; 
            statusBar.style.color = "var(--violet)"; 
            payloadFill.style.width = "0%"; 
            payloadText.innerText = "FREE"; 
            
            if (streamBar) {
                streamBar.classList.add('encode-ready');
                document.getElementById('streamContent').innerText = "[ ENCODE PAYLOAD ]";
                isEncodeReady = true;
            }
            canType = false;
        }

        const step = dataList.length;
        if (activeBlueprint) {
            const pct = (step / activeBlueprint.length) * 100;
            payloadFill.style.width = pct + "%"; 
            payloadText.innerText = Math.round(pct) + "%";
            
            if (step >= activeBlueprint.length) {
                statusBar.innerText = "PAYLOAD COMPLETE. READY TO ENCODE."; 
                statusBar.style.color = "#39ff14";
                numBtns.forEach(b => b.classList.add('btn-disabled')); 
                if (btnEnter) btnEnter.classList.add('btn-disabled'); 
                
                if (streamBar) {
                    streamBar.classList.add('encode-ready');
                    document.getElementById('streamContent').innerText = "[ ENCODE PAYLOAD ]";
                    isEncodeReady = true;
                }
                canType = false;
            } else {
                if (isEncodeReady && streamBar) {
                    streamBar.classList.remove('encode-ready');
                    document.getElementById('streamContent').innerText = "> LOGGING: ";
                    isEncodeReady = false;
                }
            }
        }

        const expected = activeBlueprint ? activeBlueprint[step] : null;

        if (expected === 'X' || expected === '-' || expected === 'P') {
            if (btnEnter) btnEnter.classList.add('btn-disabled');
            canType = false;
            if (!isAutoSkipping) {
                isAutoSkipping = true;
                if (expected === 'P') {
                    statusBar.innerText = `[ SYSTEM HALT ] AWAITING PHASE 2...`; statusBar.style.color = "var(--gold)"; 
                    numBtns.forEach(b => b.classList.add('btn-disabled'));
                    document.getElementById('phase2Modal').style.display = 'flex';
                } else {
                    statusBar.innerText = `AUTO-JUMPING... [${expected}]`; statusBar.style.color = "var(--crimson)"; 
                    numBtns.forEach(b => b.classList.add('btn-disabled'));
                    setTimeout(() => { isAutoSkipping = false; addSkip(expected); }, 80); 
                }
            }
        }

        let zoneLabel = ""; let prompt = ""; let regex = null;

        if (activeBlueprint && canType) {
            if (mode === 'T1') {
                let zoneIdx = 0; if (step < 12) zoneIdx = Math.floor(step / 2); else if (step > 12) zoneIdx = Math.floor((step - 13) / 2);
                zoneLabel = t1Labels[zoneIdx] || "SYS";
                let tA = showTolerance ? " [50.0-59.9]" : " <span style='color: var(--crimson);'>[+]</span>";
                let tB = showTolerance ? " [4.0-7.9]" : " <span style='color: var(--crimson);'>[+]</span>";
                let tC = showTolerance ? " [80.0-95.9]" : " <span style='color: var(--crimson);'>[+]</span>";
                if (expected === 'A') prompt = "Total(mg)" + tA; if (expected === 'B') prompt = "Samp(mg)" + tB; if (expected === 'C') prompt = "2nd Tg" + tC; if (expected === 'D') prompt = "3rd Tg" + tC;
                regex = regexRulesT1[expected];
            } else if (mode === 'T2') {
                let aCount = 0; for(let i=0; i<=step; i++) if(activeBlueprint[i] === 'A') aCount++;
                if(aCount > 0) zoneLabel = t2Labels[aCount - 1]; else zoneLabel = "SYS";
                if (expected === 'A') prompt = "Braze Length"; if (expected === 'B') prompt = "Porosity Length"; regex = /^\d*\.?\d*$/; 
            } else if (mode === 'T3') {
                if (step < 14) zoneLabel = "S1"; else if (step < 28) zoneLabel = "S5"; else zoneLabel = "S7/8";
                if (expected === 'J' || expected === 'K') { prompt = t3Names[step % 14] + (showTolerance ? " [ .1x - .4x ]" : " <span style='color: var(--crimson);'>[+]</span>"); regex = /^[1-4][0-9]?$/; } 
                else { prompt = t3Names[step % 14] + (showTolerance ? " [ .2x - .4x ]" : " <span style='color: var(--crimson);'>[+]</span>"); regex = /^[2-4][0-9]?$/; }
            }

            statusBar.innerHTML = `[${zoneLabel}] ${prompt}`; statusBar.style.color = "white";

            // TACTICAL S-LEVEL LIGHT UPDATE
            if (mode === 'T1' || mode === 'T3') {
                const segS1 = document.getElementById('segS1');
                const segS5 = document.getElementById('segS5');
                const segS7 = document.getElementById('segS7');
                if (segS1) { segS1.classList.remove('active'); segS5.classList.remove('active'); segS7.classList.remove('active'); }
                
                if (zoneLabel.includes('S1')) { if (segS1) segS1.classList.add('active'); }
                else if (zoneLabel.includes('S5')) { if (segS5) segS5.classList.add('active'); }
                else if (zoneLabel.includes('S7')) { if (segS7) segS7.classList.add('active'); }
            }

            numBtns.forEach(btn => {
                let char = btn.innerText; 
                if (!char || char === 'UNDO' || char === 'ENTER') return; 
                let testStr = currentString + char; 
                if (regex && !regex.test(testStr)) btn.classList.add('btn-disabled');
            });

            if (mode === 'T1' || mode === 'T2') { 
                if (currentString === "" || currentString.endsWith('.')) {
                    if (btnEnter) btnEnter.classList.add('btn-disabled'); 
                }
            } else if (mode === 'T3') { 
                if (currentString === "") {
                    if (btnEnter) btnEnter.classList.add('btn-disabled'); 
                }
            }
        }

        if (canType) curInputEl.classList.add('typing-active');
        else curInputEl.classList.remove('typing-active');
    }

    function startPhase2() { document.getElementById('phase2Modal').style.display = 'none'; isAutoSkipping = false; triggerShockwave(); addSkip('P'); }

    // THE FLAWLESS, WORKING TYPE ENGINE
    function typeNum(char) {
        if (isAutoSkipping || isSubmitting) return; 
        const mode = document.getElementById('modeSelector').value;
        if (char === '.' && currentString.includes('.')) return;
        if (mode === 'T3' && char === '.') return; 

        currentString += char; scrambleInputDisplay(); 
        
        let expected = activeBlueprint ? activeBlueprint[dataList.length] : null;
        if (mode === 'T1') {
            if (expected && !currentString.includes('.')) {
                if ((expected === 'A' || expected === 'C' || expected === 'D') && currentString.length === 2) currentString += '.';
                else if (expected === 'B' && currentString.length === 1) currentString += '.';
            }
            if (currentString.includes('.') && currentString.split('.')[1].length === 2) { 
                isSubmitting = true;
                document.getElementById('currentInput').classList.remove('typing-active');
                setTimeout(() => { submitNumber(); isSubmitting = false; }, 150); 
                return; 
            }
        } else if (mode === 'T3') {
            if (currentString.length === 2) { 
                isSubmitting = true;
                document.getElementById('currentInput').classList.remove('typing-active');
                setTimeout(() => { submitNumber(); isSubmitting = false; }, 150); 
                return; 
            }
        }
        updateDisplay();
    }

    function submitNumber() { if (currentString === "") return; triggerShockwave(); dataList.push(currentString); currentString = ""; updateDisplay(); }
    function addSkip(type) { if (currentString !== "") submitNumber(); dataList.push(type); updateDisplay(); }
    function clearLast() {
        if (isAutoSkipping || isSubmitting) return;
        if (currentString !== "") currentString = currentString.slice(0, -1);
        else if (dataList.length > 0) {
            let popped = dataList.pop(); while (popped === 'X' || popped === '-' || popped === 'P') { popped = dataList.pop(); } currentString = popped; 
        } updateDisplay();
    }

    function triggerEncoding() {
        if (currentString !== "") submitNumber(); 
        if (dataList.length === 0) return;
        triggerShockwave();

        const mode = document.getElementById('modeSelector').value;
        document.getElementById('qrModal').style.display = 'flex';
        
        if (mode === 'T1') {
            document.getElementById('qrGenerationWrapper').style.display = 'none';
            document.getElementById('aiConsoleWrapper').style.display = 'block';
            runT1Diagnostic();
        } else {
            document.getElementById('aiConsoleWrapper').style.display = 'none';
            document.getElementById('qrGenerationWrapper').style.display = 'block';
            generateFinalQR();
        }
    }

    function runT1Diagnostic() {
        const log = document.getElementById('aiOutputLog');
        log.innerHTML = `<div class="ai-line" style="color: var(--text-muted);">> NEURAL AGENT INITIATING DSC ANALYSIS...</div>`;
        
        setTimeout(() => {
            log.innerHTML += `<div class="ai-line" style="color: var(--text-muted);">> CROSS-REFERENCING DELTA LIMITS (±5.00)...</div>`;
            
            setTimeout(() => {
                let numbersOnly = dataList.filter(e => e !== 'P').map(Number);
                let allPassed = true;
                failedZonesTracker = []; 

                for (let i = 0; i < 6; i++) {
                    let c_idx = 12 + i*2; let d_idx = 12 + i*2 + 1;
                    let real_c_idx = 13 + i*2; let real_d_idx = 13 + i*2 + 1;

                    let c_val = numbersOnly[c_idx]; let d_val = numbersOnly[d_idx];
                    
                    if (c_val !== undefined && d_val !== undefined) {
                        let diff = Math.abs(d_val - c_val);
                        if (diff > 5) {
                            allPassed = false;
                            failedZonesTracker.push({ zone: i, name: t1Labels[i], diff: diff.toFixed(2), c_val: c_val, d_val: d_val, real_c_idx: real_c_idx, real_d_idx: real_d_idx });
                        }
                    }
                }

                if (allPassed) {
                    log.innerHTML += `
                        <div class="ai-line" style="margin-top: 15px;">
                            <span class="ai-success">> ALL ZONES VERIFIED. POLYMER CROSSLINKING OPTIMAL.</span>
                        </div>
                        <div class="ai-line" style="color: #b8a6d4; margin-top: 5px;">> Generating final payload structure...</div>`;
                    
                    setTimeout(() => { generateFinalQR(); }, 1500);
                } else {
                    let failHTML = `<div class="ai-line" style="margin-top: 15px;"><span class="ai-extreme">> ANOMALY DETECTED. POTENTIAL OPERATOR TYPO OR PROCESS FAILURE.</span></div>`;
                    
                    failedZonesTracker.forEach((err, index) => {
                        let severity = err.diff > 7 ? 'EXTREME' : 'MINOR';
                        let severityClass = err.diff > 7 ? 'ai-extreme' : 'ai-minor';
                        let advice = err.diff > 7 
                            ? `<ul class="ai-list" style="color: var(--crimson);"><li>QUARANTINE BATCH. Substrate under-cure detected.</li><li>Verify oven burner profile & air flow.</li><li>Escalate to Process Engineer.</li></ul>`
                            : `<ul class="ai-list" style="color: var(--bright-purple);"><li>Review DSC thermogram curves.</li><li>Verify baseline tangent integration.</li><li>Check sample pan lid seating.</li></ul>`;

                        failHTML += `
                            <div class="typo-box ai-line" style="animation-delay: ${0.2 + (index*0.1)}s;">
                                <div class="typo-label">[ ${err.name} ] ΔTg = ${err.diff} - ${severity} DEVIATION</div>
                                ${advice}
                                <div style="color: #fff; font-size: 0.8rem; margin-bottom: 5px;">[ OPERATOR PROMPT: IS THIS A TYPO? ]</div>
                                <div class="typo-input-group">
                                    <span style="color: var(--text-muted);">2nd Tg:</span>
                                    <input type="number" step="0.01" id="fix_c_${err.zone}" class="typo-input" value="${err.c_val}">
                                    <span style="color: var(--text-muted); margin-left: 10px;">3rd Tg:</span>
                                    <input type="number" step="0.01" id="fix_d_${err.zone}" class="typo-input" value="${err.d_val}">
                                </div>
                            </div>`;
                    });

                    failHTML += `
                        <div class="ai-line" style="margin-top: 15px; animation-delay: 0.8s;">
                            <button class="btn-ai-action btn-update" onclick="applyTypoFixes()">[ UPDATE MATRIX & RECALCULATE ]</button>
                            <button class="btn-ai-action btn-override" onclick="generateFinalQR()">[ CONFIRM ANOMALIES (PROCEED TO QR) ]</button>
                        </div>`;

                    log.innerHTML += failHTML;
                }
            }, 800);
        }, 600);
    }

    function applyTypoFixes() {
        failedZonesTracker.forEach(err => {
            dataList[err.real_c_idx] = document.getElementById(`fix_c_${err.zone}`).value;
            dataList[err.real_d_idx] = document.getElementById(`fix_d_${err.zone}`).value;
        });
        updateDisplay(); 
        runT1Diagnostic(); 
    }

    function generateFinalQR() {
        document.getElementById('aiConsoleWrapper').style.display = 'none';
        document.getElementById('qrGenerationWrapper').style.display = 'block';

        let payload = "";
        const mode = document.getElementById('modeSelector').value;
        const morphWrapper = document.getElementById('qrMorphWrapper');
        morphWrapper.classList.remove('morph-active');

        document.getElementById('btnToggleData').style.display = 'none';
        document.getElementById('expandedData').style.display = 'none';
        document.getElementById('btnToggleData').innerText = "[ ACCESS ZONE DATA ]";

        let validationHTML = "";
        let expandedHTML = "";

        if (mode === 'T1') {
            let numbersOnly = dataList.filter(e => e !== 'P').map(Number);
            let errors = [];
            for (let i = 0; i < 6; i++) {
                let a_val = numbersOnly[i*2]; let b_val = numbersOnly[i*2 + 1]; let c_val = numbersOnly[12 + i*2]; let d_val = numbersOnly[12 + i*2 + 1];
                let zoneName = t1Labels[i];

                if (a_val !== undefined || b_val !== undefined) {
                    let passed = true; let diffText = "AWAITING Tg DATA"; let statusClass = "card-pass"; let resultClass = "zone-values";
                    if (c_val !== undefined && d_val !== undefined) {
                        let difference = d_val - c_val; passed = Math.abs(difference) <= 5;
                        if (!passed) { errors.push(`[${zoneName}] FAILED`); statusClass = "card-fail"; resultClass = "zone-result-fail"; } 
                        else { resultClass = "zone-result-pass"; }
                        diffText = `> Tg (D-C): ${difference.toFixed(2)} [${passed ? 'PASS' : 'FAIL'}]`;
                    }
                    expandedHTML += `<div class="data-card ${statusClass}"><div class="zone-title">${zoneName}</div><div class="zone-values">Total(mg): ${a_val !== undefined ? a_val : '--'} | Samp(mg): ${b_val !== undefined ? b_val : '--'}<br>2nd Tg: ${c_val !== undefined ? c_val.toFixed(2) : '--'} | 3rd Tg: ${d_val !== undefined ? d_val.toFixed(2) : '--'}</div><div class="${resultClass}">${diffText}</div></div>`;
                }

                if (a_val !== undefined) payload += a_val + "\r\n"; if (b_val !== undefined) payload += b_val + "\r\n";
                if (c_val !== undefined) payload += c_val + "\r\n"; if (d_val !== undefined) payload += d_val + "\r\n";
                if (d_val !== undefined) { payload += "\r\n\r\n\r\n\r\n\r\n\r\n"; if (i === 2) payload += "\r\n\r\n"; }
            }
            if (errors.length === 0) validationHTML = `<div style="color: #39ff14; font-size: 1.1rem; font-weight: bold; margin-bottom: 10px;">> ALL ZONES VERIFIED <</div>`;
            else validationHTML = `<div style="color: var(--crimson); font-size: 1rem; font-weight: bold; margin-bottom: 10px;">> ANOMALIES LOGGED IN PAYLOAD <br>${errors.join(', ')}</div>`;
            
            document.getElementById('expandedData').innerHTML = expandedHTML;
            document.getElementById('btnToggleData').style.display = 'block';
        }
        else if (mode === 'T2') {
            let t2Data = []; let aCount = -1;
            for (let i = 0; i < dataList.length; i++) {
                if (activeBlueprint[i] === 'A') { aCount++; t2Data[aCount] = { name: t2Labels[aCount], a: dataList[i], b: '--' }; } 
                else if (activeBlueprint[i] === 'B') t2Data[aCount].b = dataList[i];
            }
            t2Data.forEach(zone => { expandedHTML += `<div class="data-card card-pass"><div class="zone-title">${zone.name}</div><div class="zone-values">Braze Length: ${zone.a} ${zone.b !== '--' ? `| Porosity Total: ${zone.b}` : ''}</div></div>`; });
            validationHTML = `<div style="color: var(--violet); font-size: 1.1rem; font-weight: bold; margin-bottom: 10px;">> T2 DATA LOGGED SUCCESSFULLY <</div>`;
            
            for (let i = 0; i < dataList.length; i++) {
                let e = dataList[i];
                if (e === 'X') payload += "\r\n\r\n\r\n\r\n\r\n\r\n"; else if (e === '-') payload += "\r\n\r\n"; else { payload += e + "\r\n"; } 
            }
            document.getElementById('expandedData').innerHTML = expandedHTML;
            document.getElementById('btnToggleData').style.display = 'block';
        } 
        else if (mode === 'T3') {
            const mapping = [1, 2, 5, 6, 9, 10, 13, 0, 3, 4, 7, 8, 11, 12];
            for (let chunk = 0; chunk < dataList.length; chunk += 14) {
                for (let m = 0; m < mapping.length; m++) {
                    let e = dataList[chunk + mapping[m]];
                    if (e !== undefined) { if (!e.startsWith('.')) e = '.' + e; payload += e + "\r\n"; }
                }
            }
            validationHTML = `<div style="color: var(--violet); font-size: 1.1rem; font-weight: bold; margin-bottom: 10px;">> T3 THICKNESS LOGGED SUCCESSFULLY <</div>`;
        }

        document.getElementById('validationMessage').innerHTML = validationHTML;
        new QRious({ element: document.getElementById('qrCanvas'), value: payload, size: 240, level: 'M' });
        setTimeout(() => { morphWrapper.classList.add('morph-active'); }, 500);
    }

    function toggleData() {
        const el = document.getElementById('expandedData'); const btn = document.getElementById('btnToggleData');
        if (el.style.display === 'none') { el.style.display = 'block'; btn.innerText = "[ HIDE ZONE DATA ]"; } 
        else { el.style.display = 'none'; btn.innerText = "[ ACCESS ZONE DATA ]"; }
    }

    function closeQR() { 
        document.getElementById('qrModal').style.display = 'none'; 
        dataList = []; 
        saveLocalState(); 
        updateDisplay(); 
    }

    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*<>";
    function applyCipherEffect(elements) {
        elements.forEach(btn => {
            btn.addEventListener('mouseenter', event => {
                let iterations = 0; const targetText = btn.dataset.cipher; const textElement = btn.querySelector('.btn-title');
                clearInterval(btn.dataset.interval);
                btn.dataset.interval = setInterval(() => {
                    textElement.innerText = targetText.split("").map((letter, index) => {
                        if(index < iterations) return targetText[index]; return letters[Math.floor(Math.random() * letters.length)];
                    }).join("");
                    if(iterations >= targetText.length) clearInterval(btn.dataset.interval);
                    iterations += 1 / 2;
                }, 20);
            });
        });
    }
    applyCipherEffect(document.querySelectorAll('.cipher-btn'));

    const stream = document.getElementById('streamContent');
    function generateHex() {
        let result = ''; const chars = 'ABCDEF0123456789';
        for (let i = 0; i < 8; i++) result += chars.charAt(Math.floor(Math.random() * chars.length)); return `0x${result}`;
    }
    setInterval(() => {
        if (isEncodeReady) return; 
        let currentText = stream.innerText;
        if (currentText.length > 80) currentText = "> LOGGING: "; stream.innerText = currentText + " " + generateHex();
    }, 120);

    const canvas = document.getElementById('particleCanvas'); const ctx = canvas.getContext('2d'); let particlesArray = [];
    function initCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', initCanvas); initCanvas();
    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height; this.size = Math.random() * 1.5 + 0.2; this.speedX = Math.random() * 0.4 - 0.2; this.speedY = Math.random() * -0.8 - 0.2; 
            const colors = ['rgba(255, 30, 70,', 'rgba(157, 0, 255,', 'rgba(200, 180, 240,']; this.colorBase = colors[Math.floor(Math.random() * colors.length)]; this.opacity = Math.random() * 0.4 + 0.05;
        }
        update() { this.x += this.speedX; this.y += this.speedY; if (this.y < 0) { this.y = canvas.height; this.x = Math.random() * canvas.width; } if (this.x < 0 || this.x > canvas.width) this.speedX = -this.speedX; }
        draw() { ctx.fillStyle = `${this.colorBase} ${this.opacity})`; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
    }
    function initParticles() { particlesArray = []; const numberOfParticles = Math.floor((canvas.width * canvas.height) / 7000); for (let i = 0; i < numberOfParticles; i++) particlesArray.push(new Particle()); }
    function animateParticles() { ctx.clearRect(0, 0, canvas.width, canvas.height); for (let i = 0; i < particlesArray.length; i++) { particlesArray[i].update(); particlesArray[i].draw(); } requestAnimationFrame(animateParticles); }
    initParticles(); animateParticles();

</script>
