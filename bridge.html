<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>NEURAL BRIDGE // CORSAIR DATA INPUT</title>
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="apple-mobile-web-app-title" content="NEURAL_OS">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;900&family=Noto+Sans+JP:wght@300;500;700&display=swap');

        :root {
            --crimson: #ff1e46;
            --blood-glow: rgba(255, 30, 70, 0.5);
            --violet: #9d00ff;
            --void-purple: #120322;
            --bg-deep: #020104;
            --glass-bg: rgba(12, 5, 18, 0.7);
            --glass-border: rgba(157, 0, 255, 0.2);
            --text-main: #f0e6fa;
            --text-muted: #84729c;
            --font-en: 'Rajdhani', sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
            --font-jp: 'Noto Sans JP', sans-serif;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: var(--bg-deep); color: var(--text-main);
            display: flex; flex-direction: column; align-items: center; 
            overflow-x: hidden; position: relative; font-family: var(--font-en);
            overscroll-behavior-y: none;
        }

        /* --- INTRUSION BOOT SCREEN --- */
        #bootScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; display: flex; flex-direction: column;
            padding: 30px; font-family: var(--font-mono); color: var(--crimson);
            box-sizing: border-box; overflow: hidden; pointer-events: none;
            transition: opacity 0.5s ease-out, filter 0.5s ease-out;
        }
        .boot-line { font-size: 0.9rem; margin-bottom: 5px; text-shadow: 0 0 5px var(--crimson); opacity: 0; }

        /* PLASMA CANVAS & ATMOSPHERE */
        #particleCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

        .corsair-mark {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 40vw; color: rgba(255, 30, 70, 0.02); z-index: 2;
            pointer-events: none; text-shadow: 0 0 60px rgba(157, 0, 255, 0.05);
            animation: phantom-pulse 6s infinite alternate ease-in-out; font-family: monospace;
        }
        @keyframes phantom-pulse { 
            0% { opacity: 0.2; filter: blur(8px); transform: translate(-50%, -50%) scale(0.98); } 
            100% { opacity: 1; filter: blur(12px); transform: translate(-50%, -50%) scale(1.02); } 
        }

        body::before {
            content: ""; position: fixed; top: -20%; left: -20%; width: 80vw; height: 80vw;
            background: radial-gradient(circle at center, rgba(157, 0, 255, 0.08) 0%, transparent 60%);
            z-index: 3; pointer-events: none;
        }
        body::after {
            content: ""; position: fixed; bottom: -20%; right: -20%; width: 80vw; height: 80vw;
            background: radial-gradient(circle at center, rgba(255, 30, 70, 0.06) 0%, transparent 60%);
            z-index: 3; pointer-events: none;
        }

        /* APPLICATION LAYER CONTAINER */
        .ui-layer {
            position: relative; z-index: 10; display: flex; flex-direction: column;
            width: 100%; max-width: 480px; height: 100vh; box-sizing: border-box;
            padding-bottom: 40px; 
        }

        /* HEADER NAV BAR */
        .header {
            background: rgba(12, 5, 18, 0.85); backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 30, 70, 0.3); padding: 12px 15px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8); flex-shrink: 0;
        }

        .btn-sys-back {
            background: rgba(255, 30, 70, 0.1); border: 1px solid var(--crimson);
            color: var(--crimson); font-family: var(--font-en); font-weight: 700;
            font-size: 0.85rem; letter-spacing: 2px; text-decoration: none;
            padding: 6px 12px; border-radius: 2px; transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 30, 70, 0.2);
        }
        .btn-sys-back:hover { background: var(--crimson); color: #000; box-shadow: 0 0 15px var(--crimson); }

        .header-title {
            font-family: var(--font-en); font-weight: 900; font-size: 1.2rem;
            letter-spacing: 3px; color: #fff; text-shadow: 0 0 10px rgba(157, 0, 255, 0.5);
            margin-left: 10px;
        }

        select {
            background: rgba(5, 2, 10, 0.9); color: var(--crimson);
            border: 1px solid var(--crimson); font-family: var(--font-en); font-weight: 700;
            font-size: 0.8rem; padding: 6px; outline: none; border-radius: 2px;
            box-shadow: 0 0 10px rgba(255, 30, 70, 0.2);
        }

        /* THREAT STATUS BAR */
        .status-bar {
            background: rgba(8, 2, 15, 0.9); color: #fff; text-align: center;
            padding: 10px 15px; font-family: var(--font-mono); font-weight: bold;
            font-size: 0.85rem; border-bottom: 1px solid var(--violet);
            text-transform: uppercase; letter-spacing: 1px; flex-shrink: 0;
            text-shadow: 0 0 5px rgba(157,0,255,0.5); transition: color 0.3s ease;
        }

        /* LOG DISPLAY TERMINAL */
        .display-area {
            flex: 1; display: flex; flex-direction: column; padding: 15px;
            background: rgba(5, 2, 10, 0.65); backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.05); overflow-y: auto;
        }

        .history-log {
            flex: 1; display: flex; flex-direction: column; justify-content: flex-end;
            font-family: var(--font-mono); color: var(--text-muted); font-size: 0.9rem;
            line-height: 1.5; margin-bottom: 10px;
        }
        .history-item { margin-bottom: 4px; border-left: 2px solid var(--violet); padding-left: 8px; }
        .history-skip { color: var(--crimson); font-style: italic; border-left: 2px solid var(--crimson); }

        .current-input {
            font-family: var(--font-mono); font-size: 2.8rem; color: var(--crimson);
            text-shadow: 0 0 15px var(--blood-glow); text-align: right;
            min-height: 55px; border-bottom: 2px solid var(--crimson); margin-bottom: 5px;
            font-weight: bold;
        }

        /* KINETIC 3D KEYPAD */
        .keypad {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
            background: rgba(2, 1, 4, 0.95); padding: 10px; flex-shrink: 0;
            border-top: 1px solid rgba(157, 0, 255, 0.2);
        }

        .btn {
            background: rgba(18, 5, 30, 0.7); border: 1px solid rgba(255,255,255,0.03);
            border-left: 2px solid var(--violet); color: #fff; font-size: 1.8rem;
            padding: 16px 0; font-family: var(--font-en); font-weight: 700;
            touch-action: manipulation; transition: all 0.1s ease; position: relative;
            cursor: pointer; outline: none; border-radius: 2px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .btn:active {
            background: var(--crimson) !important; color: #000 !important;
            text-shadow: none !important; box-shadow: 0 0 20px var(--crimson) !important;
            transform: scale(0.96);
        }

        @keyframes cyber-pulse {
            0% { background-color: rgba(18, 5, 30, 0.7); color: rgba(240, 230, 250, 0.7); }
            100% { background-color: rgba(30, 10, 50, 0.9); color: #ffffff; text-shadow: 0 0 10px var(--violet); }
        }
        .num-btn { animation: cyber-pulse 1.5s infinite alternate ease-in-out; }

        .btn-disabled {
            opacity: 0.12; pointer-events: none; filter: grayscale(100%);
            border-color: transparent !important; animation: none !important;
            color: #fff !important; background-color: rgba(10,10,12,0.5) !important;
            box-shadow: none !important;
        }

        .btn-action { background: rgba(25, 8, 40, 0.8); color: var(--violet); font-size: 1.1rem; font-weight: 900; animation: none; }
        .btn-undo { background: rgba(30, 5, 15, 0.8); color: var(--crimson); border-left-color: var(--crimson); }
        
        .btn-enter {
            background: rgba(10, 30, 15, 0.8); border-left: 3px solid #39ff14; color: #39ff14;
            font-weight: 900; grid-column: span 3; animation: none; font-size: 1.2rem;
            letter-spacing: 2px; text-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
        }
        .btn-compile {
            background: var(--crimson); color: #000; grid-column: span 3; font-weight: 900;
            padding: 16px 0; font-size: 1.4rem; letter-spacing: 3px;
            box-shadow: 0 0 20px var(--blood-glow); animation: none; border: none;
        }

        /* QR PAYLOAD OVERLAY MODAL */
        #qrModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 1, 4, 0.95); backdrop-filter: blur(15px); z-index: 100;
            flex-direction: column; align-items: center; padding: 20px; box-sizing: border-box; overflow-y: auto;
        }
        #validationMessage { width: 100%; max-width: 380px; margin-top: 10px; font-family: var(--font-mono); }
        .qr-container {
            background: white; padding: 15px; border-radius: 2px;
            box-shadow: 0 0 30px var(--blood-glow); margin: 20px 0; border: 4px solid var(--crimson);
        }
        .btn-toggle-data {
            background: transparent; border: 1px solid var(--violet); color: var(--violet);
            padding: 12px 20px; font-size: 1rem; font-family: var(--font-en); font-weight: bold;
            width: 100%; max-width: 380px; margin-bottom: 15px; letter-spacing: 2px;
        }
        .btn-close {
            background: var(--crimson); border: none; color: #000; padding: 15px 40px;
            font-weight: 900; font-size: 1.2rem; font-family: var(--font-en); width: 100%;
            max-width: 380px; margin-bottom: 40px; box-shadow: 0 0 20px var(--blood-glow);
            letter-spacing: 2px; cursor: pointer;
        }

        #expandedData { width: 100%; max-width: 380px; margin-bottom: 20px; }
        .data-card {
            background: rgba(12, 5, 18, 0.8); border: 1px solid rgba(255,255,255,0.05);
            padding: 12px; margin-bottom: 10px; font-family: var(--font-mono); font-size: 0.9rem;
            line-height: 1.5; position: relative;
        }
        .data-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
        .card-pass { border-color: rgba(57,255,20,0.3); } .card-pass::before { background: #39ff14; box-shadow: 0 0 10px #39ff14; }
        .card-fail { border-color: rgba(255,30,70,0.3); } .card-fail::before { background: var(--crimson); box-shadow: 0 0 10px var(--crimson); }
        .zone-title { font-weight: bold; color: var(--violet); border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 4px; margin-bottom: 6px; }
        .zone-values { color: #ccc; font-size: 0.85rem; line-height: 1.6; }
        .zone-result-pass { color: #39ff14; font-weight: bold; margin-top: 4px; }
        .zone-result-fail { color: var(--crimson); font-weight: bold; margin-top: 4px; }

        /* DATA HARVESTER STREAM */
        .threat-stream {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 40px;
            background: rgba(5, 2, 8, 0.95); border-top: 1px solid var(--crimson);
            font-family: monospace; font-size: 0.7rem; color: var(--crimson);
            display: flex; align-items: center; padding: 0 15px; box-sizing: border-box;
            z-index: 50; overflow: hidden; white-space: nowrap; box-shadow: 0 0 20px rgba(255, 30, 70, 0.2);
        }
        .stream-content { opacity: 0.7; letter-spacing: 1px; }

        @keyframes fade-in { 0% { opacity: 0; transform: translateY(5px); } 100% { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<!-- BOOT INTERCEPT SEQUENCE -->
<div id="bootScreen">
    <div class="boot-line" style="animation: fade-in 0.1s forwards 0.1s;">> INITIATING BRIDGE PROTOCOL...</div>
    <div class="boot-line" style="animation: fade-in 0.1s forwards 0.3s; color: white;">> CONNECTING TO NEURAL DATA BUS... OK</div>
    <div class="boot-line" style="animation: fade-in 0.1s forwards 0.5s; color: white;">> CALIBRATING SENSOR BLUEPRINT... OK</div>
    <div class="boot-line" style="animation: fade-in 0.1s forwards 0.7s; font-weight: bold; font-size: 1.1rem;">> ACCESS GRANTED. SENSOR MATRIX READY...</div>
</div>

<canvas id="particleCanvas"></canvas>
<div class="corsair-mark">☠</div>

<div id="appLayer" class="ui-layer">
    <div class="header">
        <a href="index.html" class="btn-sys-back">&lt; SYS</a>
        <span class="header-title">BRIDGE</span>
        <select id="modeSelector" onchange="changeMode()">
            <option value="T1">T1 (Tg Match)</option>
            <option value="T2">T2 (Braze Joints)</option>
            <option value="T3">T3 (Thickness)</option>
            <option value="FREE">FREE MODE</option>
        </select>
    </div>

    <div class="status-bar" id="statusBar">INITIATING DATA MATRIX...</div>

    <div class="display-area" id="displayArea">
        <div class="history-log" id="historyLog"></div>
        <div class="current-input" id="currentInput"></div>
    </div>

    <div class="keypad">
        <button class="btn btn-action btn-undo cipher-btn" data-cipher="[ UNDO LAST ]" style="grid-column: span 3;" onclick="clearLast()">
            <span class="btn-title">[ UNDO LAST ]</span>
        </button>

        <button class="btn num-btn" onclick="typeNum('1')">1</button>
        <button class="btn num-btn" onclick="typeNum('2')">2</button>
        <button class="btn num-btn" onclick="typeNum('3')">3</button>

        <button class="btn num-btn" onclick="typeNum('4')">4</button>
        <button class="btn num-btn" onclick="typeNum('5')">5</button>
        <button class="btn num-btn" onclick="typeNum('6')">6</button>

        <button class="btn num-btn" onclick="typeNum('7')">7</button>
        <button class="btn num-btn" onclick="typeNum('8')">8</button>
        <button class="btn num-btn" onclick="typeNum('9')">9</button>

        <button class="btn num-btn" id="btnDecimal" onclick="typeNum('.')">.</button>
        <button class="btn num-btn" onclick="typeNum('0')">0</button>
        <button class="btn btn-action" style="opacity: 0.1; pointer-events: none; animation: none;">+/-</button>

        <button class="btn btn-enter cipher-btn" data-cipher="INSERT DATA" id="btnEnter" onclick="submitNumber()">
            <span class="btn-title">INSERT DATA</span>
        </button>
        <button class="btn btn-compile cipher-btn" data-cipher="ENCODE PAYLOAD" onclick="generateQR()">
            <span class="btn-title">ENCODE PAYLOAD</span>
        </button>
    </div>
</div>

<!-- QR MODAL -->
<div id="qrModal">
    <div id="validationMessage"></div>
    <div class="qr-container"><canvas id="qrCanvas"></canvas></div>
    <button class="btn-toggle-data" id="btnToggleData" onclick="toggleData()" style="display:none;">[ ACCESS ZONE DATA ]</button>
    <div id="expandedData" style="display:none;"></div>
    <button class="btn-close" onclick="closeQR()">PURGE MEMORY & CLOSE</button>
</div>

<!-- DATA HARVESTER STREAM -->
<div class="threat-stream">
    <div class="stream-content" id="streamContent">> LOGGING: </div>
</div>

<script>
    // --- MALICIOUS BOOT SCREEN LOGIC ---
    window.onload = () => {
        setTimeout(() => {
            const boot = document.getElementById('bootScreen');
            boot.style.opacity = '0'; boot.style.filter = 'blur(10px)';
        }, 1100);
    };

    // --- DATA BRIDGE ENGINE ---
    let dataList = [];
    let currentString = "";
    let isAutoSkipping = false;
    
    // TEMPLATE 1
    const template1 = [
        'A','B','C','D','X', 'A','B','C','D','X', 'A','B','C','D','X','-', 
        'A','B','C','D','X', 'A','B','C','D','X', 'A','B','C','D','X'
    ];
    
    // TEMPLATE 2 
    const template2 = [
        'A','B','X', 'A','B','X', 'A','B','X', 'A','B','X', 'A','B','X', 'A','B','X', 
        'A','B','X', 'A','B','-', 'A','-', 'A','-', 'A','X','-','-',      
        'A','B','X', 'A','B','X', 'A','B','X', 'A','B','X', 'A','B','X', 'A','B','X', 
        'A','B','X', 'A','B','-', 'A','-', 'A','-', 'A','X','-','-'       
    ];

    // TEMPLATE 3 
    const template3 = [
        'A','B','C','D','E','F','J','K','A','B','C','D','E','F',
        'A','B','C','D','E','F','J','K','A','B','C','D','E','F',
        'A','B','C','D','E','F','J','K','A','B','C','D','E','F'
    ];

    const t1Labels = ["S1 - QR SIDE", "S1 - BACK SIDE", "S5 - QR SIDE", "S5 - BACK SIDE", "S7/8 - QR SIDE", "S7/8 - BACK SIDE"];
    const t2Labels = ["QR SIDE - A1", "QR SIDE - A2", "QR SIDE - B1", "QR SIDE - B2", "QR SIDE - B3", "QR SIDE - B4", "QR SIDE - C", "QR SIDE - D", "QR SIDE - E1", "QR SIDE - E2", "QR SIDE - W", "BACK SIDE - A1", "BACK SIDE - A2", "BACK SIDE - B1", "BACK SIDE - B2", "BACK SIDE - B3", "BACK SIDE - B4", "BACK SIDE - C", "BACK SIDE - D", "BACK SIDE - E1", "BACK SIDE - E2", "BACK SIDE - W"];

    const regexRulesT1 = {
        'A': /^(5|5[0-9]|5[0-9]\.|5[0-9]\.[0-9]{0,2})$/,                               
        'B': /^([4-7]|[4-7]\.|[4-7]\.[0-9]{0,2})$/,                                     
        'C': /^(8|9|8[0-9]|9[0-5]|8[0-9]\.|9[0-5]\.|8[0-9]\.[0-9]{0,2}|9[0-5]\.[0-9]{0,2})$/,  
        'D': /^(8|9|8[0-9]|9[0-5]|8[0-9]\.|9[0-5]\.|8[0-9]\.[0-9]{0,2}|9[0-5]\.[0-9]{0,2})$/   
    };

    let activeBlueprint = template1; 

    // --- URL PARAMETER AUTO-SELECT ---
    const urlParams = new URLSearchParams(window.location.search);
    const modeParam = urlParams.get('mode');
    if (modeParam && ['T1', 'T2', 'T3', 'FREE'].includes(modeParam)) {
        document.getElementById('modeSelector').value = modeParam;
    }

    function changeMode() {
        const val = document.getElementById('modeSelector').value;
        if (val === 'T1') activeBlueprint = template1;
        else if (val === 'T2') activeBlueprint = template2;
        else if (val === 'T3') activeBlueprint = template3;
        else activeBlueprint = null;
        
        dataList = []; currentString = ""; updateDisplay();
    }

    function updateDisplay() {
        document.getElementById('currentInput').innerText = currentString;
        
        let html = "";
        dataList.forEach((item, index) => {
            if (item === 'X') html += `<div class="history-item history-skip">SYS_JMP: +3 CELLS</div>`;
            else if (item === '-') html += `<div class="history-item history-skip">SYS_JMP: +1 CELL</div>`;
            else {
                let varName = "";
                let expectedVar = activeBlueprint ? activeBlueprint[index] : null;
                const mode = document.getElementById('modeSelector').value;
                
                if (mode === 'T1') {
                    if(expectedVar === 'A') varName = "Total Mass:";
                    else if(expectedVar === 'B') varName = "Sample Mass:";
                    else if(expectedVar === 'C') varName = "2nd Tg:";
                    else if(expectedVar === 'D') varName = "3rd Tg:";
                } else if (mode === 'T2') {
                    if(expectedVar === 'A') varName = "Braze Length:";
                    else if(expectedVar === 'B') varName = "Porosity Total:";
                } else if (mode === 'T3') {
                    if(expectedVar === 'A') varName = "Slot 1:";
                    else if(expectedVar === 'B') varName = "Slot 2:";
                    else if(expectedVar === 'C') varName = "Slot 16:";
                    else if(expectedVar === 'D') varName = "Slot 17:";
                    else if(expectedVar === 'E') varName = "Slot 27:";
                    else if(expectedVar === 'F') varName = "Slot 28:";
                    else if(expectedVar === 'J') varName = "Right Edge:";
                    else if(expectedVar === 'K') varName = "Left Edge:";
                }
                
                if (varName === "") varName = `VAL_${index+1}:`;
                let dispItem = item;
                if (mode === 'T3' && !dispItem.startsWith('.')) dispItem = '.' + dispItem;

                html += `<div class="history-item">${varName} <span style="color:white;">${dispItem}</span></div>`;
            }
        });
        document.getElementById('historyLog').innerHTML = html;
        
        const displayArea = document.getElementById('displayArea');
        displayArea.scrollTop = displayArea.scrollHeight;
        checkBlueprint();
    }

    function checkBlueprint() {
        const numBtns = document.querySelectorAll('.num-btn');
        const btnEnter = document.getElementById('btnEnter');
        const btnDecimal = document.getElementById('btnDecimal');
        const statusBar = document.getElementById('statusBar');
        const mode = document.getElementById('modeSelector').value;

        numBtns.forEach(b => b.classList.remove('btn-disabled'));
        btnEnter.classList.remove('btn-disabled');

        if (!activeBlueprint) {
            statusBar.innerText = "SYSTEM: MANUAL OVERRIDE ACTIVE";
            statusBar.style.color = "var(--violet)";
            return;
        }

        const step = dataList.length;
        
        if (step >= activeBlueprint.length) {
            statusBar.innerText = "PAYLOAD COMPLETE. READY TO ENCODE.";
            statusBar.style.color = "#39ff14";
            numBtns.forEach(b => b.classList.add('btn-disabled'));
            btnEnter.classList.add('btn-disabled');
            return;
        }

        const expected = activeBlueprint[step];

        // --- GHOST AUTOMATION ---
        if (expected === 'X' || expected === '-') {
            btnEnter.classList.add('btn-disabled');
            if (!isAutoSkipping) {
                isAutoSkipping = true;
                statusBar.innerText = `AUTO-JUMPING... [${expected}]`;
                statusBar.style.color = "var(--crimson)";
                numBtns.forEach(b => b.classList.add('btn-disabled'));
                
                setTimeout(() => {
                    isAutoSkipping = false;
                    addSkip(expected);
                }, 80); 
            }
            return;
        }

        let zoneLabel = "";
        let prompt = "";
        let regex = null;

        if (mode === 'T1') {
            zoneLabel = `ZONE ${Math.floor(step/5)+1}`;
            if (expected === 'A') prompt = "Total Mass (mg) [50.0-59.9]";
            if (expected === 'B') prompt = "Sample Mass (mg) [4.0-7.9]";
            if (expected === 'C') prompt = "2nd Tg [80.0-95.9]";
            if (expected === 'D') prompt = "3rd Tg [80.0-95.9]";
            regex = regexRulesT1[expected];
        } else if (mode === 'T2') {
            let aCount = 0;
            for(let i=0; i<=step; i++) if(activeBlueprint[i] === 'A') aCount++;
            if(aCount > 0) zoneLabel = t2Labels[aCount - 1];
            else zoneLabel = "SYS";

            if (expected === 'A') prompt = "Braze Length";
            if (expected === 'B') prompt = "Porosity Length";
            regex = /^\d*\.?\d*$/; 
        } else if (mode === 'T3') {
            if (step < 14) zoneLabel = "S1";
            else if (step < 28) zoneLabel = "S5";
            else zoneLabel = "S7/8";

            if (expected === 'A') prompt = "Slot 1 [ .2x - .4x ]";
            if (expected === 'B') prompt = "Slot 2 [ .2x - .4x ]";
            if (expected === 'C') prompt = "Slot 16 [ .2x - .4x ]";
            if (expected === 'D') prompt = "Slot 17 [ .2x - .4x ]";
            if (expected === 'E') prompt = "Slot 27 [ .2x - .4x ]";
            if (expected === 'F') prompt = "Slot 28 [ .2x - .4x ]";
            if (expected === 'J') prompt = "Right Edge [ .1x - .4x ]";
            if (expected === 'K') prompt = "Left Edge [ .1x - .4x ]";
            
            // Allow 1, 2, 3, or 4 for Edges. Only 2, 3, or 4 for standard slots.
            if (expected === 'J' || expected === 'K') {
                regex = /^[1-4][0-9]?$/; 
            } else {
                regex = /^[2-4][0-9]?$/; 
            }
            
            btnDecimal.classList.add('btn-disabled'); 
        }

        statusBar.innerText = `[${zoneLabel}] ${prompt}`;
        statusBar.style.color = "white";

        numBtns.forEach(btn => {
            let char = btn.innerText; 
            if (char === '+/-' || char === '.') return; 
            let testStr = currentString + char;
            if (regex && !regex.test(testStr)) btn.classList.add('btn-disabled');
        });

        if (mode === 'T1' || mode === 'T2') {
            if (currentString === "" || currentString.endsWith('.')) btnEnter.classList.add('btn-disabled');
        } else if (mode === 'T3') {
            if (currentString === "") btnEnter.classList.add('btn-disabled');
        }
    }

    function typeNum(char) {
        if (isAutoSkipping) return;
        const mode = document.getElementById('modeSelector').value;
        if (char === '.' && currentString.includes('.')) return;
        if (mode === 'T3' && char === '.') return; 

        currentString += char;
        let expected = activeBlueprint ? activeBlueprint[dataList.length] : null;
        
        if (mode === 'T1') {
            if (expected && !currentString.includes('.')) {
                if ((expected === 'A' || expected === 'C' || expected === 'D') && currentString.length === 2) currentString += '.';
                else if (expected === 'B' && currentString.length === 1) currentString += '.';
            }
            if (currentString.includes('.') && currentString.split('.')[1].length === 2) {
                submitNumber(); return; 
            }
        } else if (mode === 'T3') {
            if (currentString.length === 2) {
                submitNumber(); return;
            }
        }
        updateDisplay();
    }

    function submitNumber() {
        if (currentString === "") return;
        dataList.push(currentString);
        currentString = "";
        updateDisplay();
    }

    function addSkip(type) {
        if (currentString !== "") submitNumber(); 
        dataList.push(type);
        updateDisplay();
    }

    function clearLast() {
        if (isAutoSkipping) return;
        if (currentString !== "") {
            currentString = currentString.slice(0, -1);
        } else if (dataList.length > 0) {
            let popped = dataList.pop();
            while (popped === 'X' || popped === '-') popped = dataList.pop(); 
            currentString = popped; 
        }
        updateDisplay();
    }

    function toggleData() {
        const el = document.getElementById('expandedData');
        const btn = document.getElementById('btnToggleData');
        if (el.style.display === 'none') {
            el.style.display = 'block';
            btn.innerText = "[ HIDE ZONE DATA ]";
        } else {
            el.style.display = 'none';
            btn.innerText = "[ ACCESS ZONE DATA ]";
        }
    }

    function generateQR() {
        if (currentString !== "") submitNumber(); 
        if (dataList.length === 0) return;

        let payload = "";
        let validationHTML = "";
        let expandedHTML = "";
        const mode = document.getElementById('modeSelector').value;
        
        document.getElementById('btnToggleData').style.display = 'none';
        document.getElementById('expandedData').style.display = 'none';
        document.getElementById('btnToggleData').innerText = "[ ACCESS ZONE DATA ]";

        if (mode === 'T1') {
            let numbersOnly = dataList.filter(e => e !== 'X' && e !== '-').map(Number);
            let allPassed = true;
            let errorMessages = [];

            for (let i = 0; i < numbersOnly.length; i += 4) {
                let zoneIdx = Math.floor(i / 4); 
                let zoneName = t1Labels[zoneIdx] || `ZONE ${zoneIdx + 1}`;
                let a_val = numbersOnly[i] !== undefined ? numbersOnly[i] : '--';
                let b_val = numbersOnly[i+1] !== undefined ? numbersOnly[i+1] : '--';
                let c_val = numbersOnly[i+2]; 
                let d_val = numbersOnly[i+3]; 

                if (c_val !== undefined && d_val !== undefined) {
                    let difference = d_val - c_val;
                    let passed = Math.abs(difference) <= 5;
                    if (!passed) { allPassed = false; errorMessages.push(`${zoneName}: D-C = ${difference.toFixed(2)}`); }

                    expandedHTML += `
                        <div class="data-card ${passed ? 'card-pass' : 'card-fail'}">
                            <div class="zone-title">${zoneName}</div>
                            <div class="zone-values">Total Mass: ${a_val}mg | Sample: ${b_val}mg<br>2nd Tg: ${c_val.toFixed(2)} | 3rd Tg: ${d_val.toFixed(2)}</div>
                            <div class="${passed ? 'zone-result-pass' : 'zone-result-fail'}">> Tg (D-C): ${difference.toFixed(2)} [${passed ? 'PASS' : 'FAIL'}]</div>
                        </div>`;
                }
            }

            if (allPassed) validationHTML = `<div style="color: #39ff14; font-size: 1.1rem; font-weight: bold; text-align: center; text-shadow: 0 0 10px #39ff14; margin-bottom: 10px;">> ALL ZONES Tg: PASSED <</div>`;
            else validationHTML = `<div style="color: var(--crimson); font-size: 1rem; font-weight: bold; text-align: center; border: 1px solid var(--crimson); padding: 10px; border-radius: 2px; background: rgba(255,30,70,0.1); margin-bottom: 10px; box-shadow: 0 0 15px rgba(255,30,70,0.4);">[!] SYS WARNING: Tg LIMIT EXCEEDED<br><br>${errorMessages.join('<br>')}</div>`;
            document.getElementById('expandedData').innerHTML = expandedHTML;
            document.getElementById('btnToggleData').style.display = 'block';
        }
        else if (mode === 'T2') {
            let t2Data = []; let aCount = -1;
            for (let i = 0; i < dataList.length; i++) {
                if (activeBlueprint[i] === 'A') { aCount++; t2Data[aCount] = { name: t2Labels[aCount], a: dataList[i], b: '--' }; } 
                else if (activeBlueprint[i] === 'B') t2Data[aCount].b = dataList[i];
            }
            t2Data.forEach(zone => {
                expandedHTML += `<div class="data-card card-pass"><div class="zone-title">${zone.name}</div><div class="zone-values">Braze Length: ${zone.a} ${zone.b !== '--' ? `| Porosity Total: ${zone.b}` : ''}</div></div>`;
            });
            validationHTML = `<div style="color: var(--violet); font-size: 1.1rem; font-weight: bold; text-align: center; text-shadow: 0 0 10px var(--violet); margin-bottom: 10px;">> T2 DATA LOGGED SUCCESSFULLY <</div>`;
            document.getElementById('expandedData').innerHTML = expandedHTML;
            document.getElementById('btnToggleData').style.display = 'block';
        }
        else if (mode === 'T3') {
            validationHTML = `<div style="color: var(--violet); font-size: 1.1rem; font-weight: bold; text-align: center; text-shadow: 0 0 10px var(--violet); margin-bottom: 10px;">> THICKNESS LOGGED SUCCESSFULLY <</div>`;
        }

        document.getElementById('validationMessage').innerHTML = validationHTML;

        for (let i = 0; i < dataList.length; i++) {
            let e = dataList[i];
            if (e === 'X') payload += "\r\n\r\n\r\n\r\n\r\n\r\n"; 
            else if (e === '-') payload += "\r\n\r\n"; 
            else { 
                if (mode === 'T3' && !e.startsWith('.')) e = '.' + e;
                payload += e + "\r\n"; 
            } 
        }

        document.getElementById('qrModal').style.display = 'flex';
        new QRious({ element: document.getElementById('qrCanvas'), value: payload, size: 240, level: 'M' });
    }

    function closeQR() {
        document.getElementById('qrModal').style.display = 'none';
        dataList = []; updateDisplay();
    }

    // --- CIPHER TEXT ENGINE ---
    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*<>";
    function applyCipherEffect(elements) {
        elements.forEach(btn => {
            btn.addEventListener('mouseenter', event => {
                let iterations = 0;
                const targetText = btn.dataset.cipher;
                const textElement = btn.querySelector('.btn-title');
                
                clearInterval(btn.dataset.interval);
                btn.dataset.interval = setInterval(() => {
                    textElement.innerText = targetText.split("")
                        .map((letter, index) => {
                            if(index < iterations) return targetText[index];
                            return letters[Math.floor(Math.random() * letters.length)];
                        })
                        .join("");
                    if(iterations >= targetText.length) clearInterval(btn.dataset.interval);
                    iterations += 1 / 2;
                }, 20);
            });
        });
    }
    applyCipherEffect(document.querySelectorAll('.cipher-btn'));

    // --- DATA HARVESTER STREAM ---
    const stream = document.getElementById('streamContent');
    function generateHex() {
        let result = ''; const chars = 'ABCDEF0123456789';
        for (let i = 0; i < 8; i++) result += chars.charAt(Math.floor(Math.random() * chars.length));
        return `0x${result}`;
    }
    setInterval(() => {
        let currentText = stream.innerText;
        if (currentText.length > 80) currentText = "> LOGGING: "; 
        stream.innerText = currentText + " " + generateHex();
    }, 120);

    // --- PLASMA PARTICLE ENGINE ---
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let particlesArray = [];
    
    function initCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', initCanvas); initCanvas();

    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height;
            this.size = Math.random() * 1.5 + 0.2; this.speedX = Math.random() * 0.4 - 0.2; this.speedY = Math.random() * -0.8 - 0.2; 
            const colors = ['rgba(255, 30, 70,', 'rgba(157, 0, 255,', 'rgba(200, 180, 240,'];
            this.colorBase = colors[Math.floor(Math.random() * colors.length)]; this.opacity = Math.random() * 0.4 + 0.05;
        }
        update() {
            this.x += this.speedX; this.y += this.speedY;
            if (this.y < 0) { this.y = canvas.height; this.x = Math.random() * canvas.width; }
            if (this.x < 0 || this.x > canvas.width) this.speedX = -this.speedX;
        }
        draw() { ctx.fillStyle = `${this.colorBase} ${this.opacity})`; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
    }

    function initParticles() {
        particlesArray = []; const numberOfParticles = Math.floor((canvas.width * canvas.height) / 7000);
        for (let i = 0; i < numberOfParticles; i++) particlesArray.push(new Particle());
    }

    function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < particlesArray.length; i++) { particlesArray[i].update(); particlesArray[i].draw(); }
        requestAnimationFrame(animateParticles);
    }

    initParticles(); animateParticles();

    // Initialize Blueprint Mode from URL on boot
    changeMode();
</script>
</body>
