<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="apple-mobile-web-app-title" content="NEURAL_OS">
    <title>WARNING // UNAUTHORIZED UPLINK</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;900&family=Noto+Sans+JP:wght@300;500;700&display=swap');

        :root {
            --crimson: #ff1e46;
            --blood-glow: rgba(255, 30, 70, 0.5);
            --violet: #9d00ff;
            --bright-purple: #d884ff;
            --neon-magenta: #ff00aa;
            --cyan: #00f3ff;
            --void-purple: #120322;
            --bg-deep: #020104;
            --glass-bg: rgba(12, 5, 18, 0.65);
            --glass-border: rgba(157, 0, 255, 0.15);
            --text-main: #f0e6fa;
            --text-muted: #84729c;
            --font-en: 'Rajdhani', sans-serif;
            --font-jp: 'Noto Sans JP', sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; min-height: 100vh; 
            background-color: var(--bg-deep); color: var(--text-main);
            display: flex; flex-direction: column; align-items: center; 
            overflow-x: hidden; position: relative; font-family: var(--font-en);
        }

        /* --- THE INTRUSION BOOT SCREEN (HIDDEN INITIALLY) --- */
        #bootScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 30px; font-family: var(--font-mono); color: var(--crimson);
            box-sizing: border-box; overflow: hidden;
            opacity: 1; pointer-events: all; filter: blur(0px);
            transition: opacity 0.5s ease-out, filter 0.5s ease-out;
        }
        #bootScreen.fade-out {
            opacity: 0; pointer-events: none; filter: blur(10px);
        }
        
        .boot-container {
            width: 100%; max-width: 600px; display: flex; flex-direction: column; justify-content: flex-end;
        }
        
        #mainSyntaxTerminal {
            font-family: var(--font-mono); font-size: 0.9rem; font-weight: bold;
            text-align: left; margin-bottom: 15px; line-height: 1.5; min-height: 130px;
            display: flex; flex-direction: column; justify-content: flex-end;
        }

        .boot-progress-container {
            width: 100%; height: 14px; border: 1px solid var(--crimson);
            background: rgba(255, 30, 70, 0.1); position: relative; margin-bottom: 20px;
            box-shadow: 0 0 10px rgba(255, 30, 70, 0.2);
        }
        .boot-progress-bar {
            height: 100%; width: 0%; background: var(--crimson);
            box-shadow: 0 0 15px var(--crimson); transition: width 0.05s linear;
        }

        .blink-cursor::after { content: '_'; animation: blink 1s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        #particleCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

        /* --- ROGUE WATERMARK & VIOLENT GLITCH --- */
        .corsair-mark {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 40vw; color: rgba(255, 30, 70, 0.02); z-index: 2;
            pointer-events: none; text-shadow: 0 0 60px rgba(157, 0, 255, 0.05);
            animation: phantom-pulse 6s infinite alternate ease-in-out; font-family: monospace;
        }
        @keyframes phantom-pulse { 0% { opacity: 0.2; filter: blur(8px); transform: translate(-50%, -50%) scale(0.98); } 100% { opacity: 1; filter: blur(12px); transform: translate(-50%, -50%) scale(1.02); } }
        
        .glitch-violent { animation: glitch-snap 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) both; }
        @keyframes glitch-snap {
            0% { transform: translate(-50%, -50%); filter: drop-shadow(0 0 0 transparent); }
            20% { transform: translate(-52%, -49%); filter: drop-shadow(-5px 0 0 var(--crimson)) drop-shadow(5px 0 0 var(--cyan)); }
            40% { transform: translate(-48%, -51%); filter: drop-shadow(5px 0 0 var(--crimson)) drop-shadow(-5px 0 0 var(--cyan)); }
            60% { transform: translate(-51%, -50%); filter: drop-shadow(-2px 0 0 var(--crimson)); }
            80% { transform: translate(-49%, -48%); filter: drop-shadow(2px 0 0 var(--cyan)); }
            100% { transform: translate(-50%, -50%); filter: drop-shadow(0 0 0 transparent); }
        }

        body::before { content: ""; position: fixed; top: -20%; left: -20%; width: 80vw; height: 80vw; background: radial-gradient(circle at center, rgba(157, 0, 255, 0.08) 0%, transparent 60%); z-index: 3; pointer-events: none; }
        body::after { content: ""; position: fixed; bottom: -20%; right: -20%; width: 80vw; height: 80vw; background: radial-gradient(circle at center, rgba(255, 30, 70, 0.06) 0%, transparent 60%); z-index: 3; pointer-events: none; }

        /* --- THE MAIN HUB (HIDDEN INITIALLY) --- */
        .hub-container {
            position: relative; z-index: 10; width: 100%; max-width: 460px;
            padding: clamp(30px, 6vh, 60px) 25px 80px 25px; box-sizing: border-box; display: flex; flex-direction: column;
            perspective: 1000px; opacity: 0; pointer-events: none; transition: opacity 1.5s ease-in-out;
        }
        .hub-container.visible { opacity: 1; pointer-events: all; }

        .threat-banner { font-family: monospace; font-size: 0.65rem; color: var(--crimson); letter-spacing: 2px; border-left: 2px solid var(--crimson); padding-left: 8px; margin-bottom: 20px; animation: glitch-flash 4s infinite; }
        .header-section { margin-bottom: 30px; display: flex; flex-direction: column; align-items: flex-start; border-bottom: 1px solid rgba(255, 30, 70, 0.2); padding-bottom: 20px; position: relative; }
        .landing-title { color: #ffffff; font-size: clamp(2.4rem, 8vw, 3.2rem); font-weight: 900; letter-spacing: 4px; line-height: 1; text-shadow: 0 0 20px rgba(157, 0, 255, 0.4); position: relative; }
        .landing-title .highlight { color: var(--crimson); text-shadow: 0 0 15px var(--blood-glow); }
        @keyframes glitch-flash { 0%, 96%, 98%, 100% { opacity: 1; } 97%, 99% { opacity: 0; transform: translateX(2px); } }
        .landing-subtitle { display: flex; align-items: center; gap: 12px; margin-top: 15px; font-family: var(--font-jp); font-size: 0.85rem; color: var(--text-muted); font-weight: 500; letter-spacing: 4px; }
        .status-dot { width: 6px; height: 6px; background-color: var(--crimson); border-radius: 50%; box-shadow: 0 0 10px var(--crimson); animation: pulse-dot 1.2s infinite; }
        @keyframes pulse-dot { 0%, 100% { opacity: 1; box-shadow: 0 0 10px var(--crimson); } 50% { opacity: 0.2; box-shadow: 0 0 2px var(--crimson); } }

        /* --- 3D KINETIC BUTTONS --- */
        .menu-btn {
            width: 100%; height: clamp(105px, 15vh, 125px); 
            background: rgba(15, 5, 20, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.02); border-right: 1px solid var(--glass-border);
            border-radius: 2px; color: var(--text-main); font-family: var(--font-en); cursor: pointer;
            margin-bottom: 20px; position: relative; overflow: hidden;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease, background 0.3s ease, border-color 0.3s ease;
            display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
            padding: 0 35px; text-align: left; transform-style: preserve-3d;
        }
        
        .menu-btn::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--crimson); transition: width 0.3s ease, box-shadow 0.3s ease; box-shadow: 0 0 20px var(--crimson); }
        .menu-btn::after { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at left center, rgba(255, 30, 70, 0.15) 0%, transparent 70%); opacity: 1; transition: opacity 0.4s ease; pointer-events: none; }
        .menu-btn:hover, .menu-btn:active { background: rgba(25, 5, 10, 0.95); border-color: rgba(255, 30, 70, 0.4); transform: translateY(-2px) scale(0.98) rotateX(2deg); box-shadow: 0 20px 40px rgba(0,0,0,0.9), inset 0 0 20px rgba(255,30,70,0.1); }
        
        .btn-lab::before { background: var(--violet); box-shadow: 0 0 20px var(--violet); border-right-color: rgba(157, 0, 255, 0.2); }
        .btn-lab::after { background: radial-gradient(circle at left center, rgba(157, 0, 255, 0.15) 0%, transparent 70%); }
        .btn-lab:hover, .btn-lab:active { background: rgba(20, 5, 30, 0.95); border-color: rgba(157, 0, 255, 0.4); inset 0 0 20px rgba(157,0,255,0.1); }

        .btn-cmm::before { background: var(--neon-magenta); box-shadow: 0 0 20px var(--neon-magenta); border-right-color: rgba(255, 0, 170, 0.2); }
        .btn-cmm::after { background: radial-gradient(circle at left center, rgba(255, 0, 170, 0.15) 0%, transparent 70%); }
        .btn-cmm:hover, .btn-cmm:active { background: rgba(25, 5, 20, 0.95); border-color: rgba(255, 0, 170, 0.4); inset 0 0 20px rgba(255, 0, 170, 0.1); }

        .btn-ref { height: clamp(52px, 7.5vh, 62px); align-items: center; justify-content: center; padding: 0; border-right: none; margin-top: -5px; }
        .btn-ref::before { background: var(--text-muted); box-shadow: 0 0 10px rgba(255,255,255,0.2); width: 3px; }
        .btn-ref::after { background: radial-gradient(circle at center, rgba(255,255,255,0.05) 0%, transparent 70%); }
        .btn-ref:hover, .btn-ref:active { background: rgba(25, 25, 30, 0.95); border-color: rgba(255, 255, 255, 0.3); box-shadow: 0 10px 20px rgba(0,0,0,0.8), inset 0 0 15px rgba(255,255,255,0.1); }
        .btn-ref:hover::before { box-shadow: 0 0 20px #fff; background: #fff; width: 4px; }

        .btn-title { font-size: clamp(1.4rem, 5vw, 1.7rem); font-weight: 900; letter-spacing: 3px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); color: #fff; }
        .btn-jp { font-family: var(--font-jp); font-size: 0.75rem; font-weight: 500; color: var(--crimson); letter-spacing: 5px; margin-top: 6px; text-transform: uppercase; opacity: 0.8; }
        .btn-lab .btn-jp { color: var(--violet); }
        
        .barcode-label { display: flex; justify-content: center; align-items: center; gap: 12px; width: 100%; color: var(--text-muted); transition: all 0.3s ease; opacity: 0.7; }
        .btn-ref:hover .barcode-label { color: #fff; opacity: 1; }
        .barcode-bars { font-family: monospace; font-size: 1.6rem; letter-spacing: -2px; transform: scaleY(1.3); transition: all 0.3s ease; }
        .btn-ref:hover .barcode-bars { text-shadow: 0 0 10px #fff; }
        .barcode-zh { font-family: var(--font-jp); font-weight: 700; font-size: 1.1rem; letter-spacing: 4px; margin-right: -4px; transition: all 0.3s ease; }
        .btn-ref:hover .barcode-zh { text-shadow: 0 0 10px #fff; }

        .submenu-wrapper { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.4s cubic-bezier(0.25, 1, 0.5, 1); width: 100%; margin-bottom: 5px; }
        .submenu-wrapper.open { grid-template-rows: 1fr; margin-bottom: 30px; }
        .sub-menu-container { overflow: hidden; display: flex; flex-direction: column; gap: 10px; padding-left: 20px; border-left: 1px solid rgba(157, 0, 255, 0.2); margin-left: 10px; }
        .sub-menu-btn { width: 100%; height: 75px; background: rgba(18, 5, 30, 0.4); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.02); border-radius: 2px; color: #d1d5db; font-family: var(--font-en); font-weight: 600; font-size: 1.1rem; letter-spacing: 1px; transition: all 0.3s ease; cursor: pointer; position: relative; overflow: hidden; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
        .sub-menu-btn::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--violet); opacity: 0.2; transition: 0.3s; }
        .sub-menu-btn:hover { background: rgba(157, 0, 255, 0.1); border-color: rgba(157, 0, 255, 0.3); transform: translateX(8px); color: #fff; }
        .sub-menu-btn:hover::before { opacity: 1; box-shadow: 0 0 15px var(--violet); }
        .sub-btn-content { display: flex; flex-direction: column; align-items: flex-start; }
        .sub-btn-jp { font-family: var(--font-jp); font-size: 0.65rem; color: #76658a; letter-spacing: 3px; margin-top: 3px; }
        .icon-arrow { font-family: 'Rajdhani', sans-serif; font-weight: 900; color: var(--violet); opacity: 0.4; font-size: 1.3rem; transition: 0.3s; }
        .sub-menu-btn:hover .icon-arrow { opacity: 1; transform: translateX(5px); text-shadow: 0 0 10px var(--violet); }

        .threat-stream { position: fixed; bottom: 0; left: 0; width: 100%; height: 45px; background: rgba(5, 2, 8, 0.9); border-top: 1px solid var(--crimson); font-family: monospace; font-size: 0.7rem; color: var(--crimson); display: flex; align-items: center; padding: 0 15px; box-sizing: border-box; z-index: 50; overflow: hidden; white-space: nowrap; box-shadow: 0 0 20px rgba(255, 30, 70, 0.2); }
        .stream-content { opacity: 0.7; letter-spacing: 1px; }

        /* --- OVERSEER / MONDAY EMAIL CARD --- */
        #aiEmailOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); z-index: 5000;
            display: none; justify-content: center; align-items: center;
            padding: 20px; box-sizing: border-box; backdrop-filter: blur(5px);
        }

        .crt-email-card {
            width: 100%; max-width: 480px; background: rgba(10, 2, 15, 0.95);
            border: 2px solid var(--bright-purple); border-radius: 4px;
            box-shadow: 0 0 30px rgba(216, 132, 255, 0.3), inset 0 0 20px rgba(0,0,0,1);
            padding: 25px; position: relative; overflow: hidden;
            transform: scale(0.9); opacity: 0;
        }

        .crt-email-card::after {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%; z-index: 10; pointer-events: none;
        }

        .crt-boot-in { animation: crt-turn-on 0.6s cubic-bezier(0.23, 1, 0.32, 1) forwards; }
        @keyframes crt-turn-on {
            0% { transform: scale(1, 0.001) translate3d(0, 0, 0); filter: brightness(5); opacity: 1; }
            40% { transform: scale(1, 0.001) translate3d(0, 0, 0); filter: brightness(3); opacity: 1; }
            100% { transform: scale(0.9) translate3d(0, 0, 0); filter: brightness(1); opacity: 1; }
        }

        .glitch-crash { animation: cyber-crash 0.5s cubic-bezier(0.8, 0, 0.2, 1) forwards; }
        @keyframes cyber-crash {
            0% { transform: scale(0.9) skew(0deg); filter: drop-shadow(0 0 0 transparent); opacity: 1; }
            20% { transform: scale(0.92) skew(-5deg); filter: drop-shadow(-10px 0 0 var(--crimson)) drop-shadow(10px 0 0 var(--cyan)); opacity: 0.8; }
            40% { transform: scale(0.88) skew(5deg); filter: drop-shadow(10px 0 0 var(--crimson)) drop-shadow(-10px 0 0 var(--cyan)); opacity: 0.9; }
            60% { transform: scale(0.9, 0.02); filter: brightness(4); opacity: 1; }
            100% { transform: scale(0, 0); filter: brightness(5); opacity: 0; }
        }

        /* --- THE MONDAY CORPORATE THEME --- */
        .corporate-theme {
            background: rgba(10, 15, 12, 0.95);
            border-color: #39ff14;
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.2), inset 0 0 20px rgba(0, 195, 255, 0.1);
        }
        .corporate-theme .email-subject { color: #39ff14; text-shadow: 0 0 10px rgba(57, 255, 20, 0.4); animation: none; }
        .corporate-theme .email-meta span { color: #00c3ff; font-family: Arial, sans-serif; letter-spacing: 0px; }
        .corporate-theme .email-meta { font-family: Arial, sans-serif; letter-spacing: 0px; color: #a1b8ac; }
        .corporate-theme .email-body { font-family: Arial, sans-serif; color: #c0d1c8; letter-spacing: 0px; }
        
        .corporate-theme .btn-purge-email {
            color: #39ff14; border-color: rgba(57,255,20,0.4);
            text-shadow: 0 0 5px rgba(57,255,20,0.5); font-family: Arial, sans-serif; letter-spacing: 1px;
        }
        .corporate-theme .btn-purge-email::before { background: #39ff14; box-shadow: 0 0 15px #39ff14; }
        .corporate-theme .btn-purge-email:active, .corporate-theme .btn-purge-email:hover {
            background: rgba(57, 255, 20, 0.15); color: #fff;
            border-color: #39ff14; box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        /* --- THE 5-SECOND MELTDOWN TRANSITION --- */
        .meltdown-transition, .meltdown-transition * {
            transition: all 5s ease-in-out !important;
        }

        .meltdown-active {
            background: rgba(30, 5, 10, 0.95) !important;
            border-color: var(--crimson) !important;
            box-shadow: 0 0 30px rgba(255, 30, 70, 0.4), inset 0 0 20px rgba(255, 30, 70, 0.2) !important;
        }
        .meltdown-active .email-subject, 
        .meltdown-active .email-meta, 
        .meltdown-active .email-meta span, 
        .meltdown-active .email-body, 
        .meltdown-active .email-body p, 
        .meltdown-active .btn-purge-email {
            color: var(--crimson) !important;
            text-shadow: 0 0 10px rgba(255, 30, 70, 0.5) !important;
            border-color: var(--crimson) !important;
        }
        .meltdown-active .btn-purge-email::before {
            background: var(--crimson) !important;
            box-shadow: 0 0 15px var(--crimson) !important;
        }

        /* --- THE HACKING UI INSIDE EMAIL --- */
        .email-hack-ui {
            font-family: var(--font-mono); font-size: 0.95rem; font-weight: bold;
            text-align: left; margin-bottom: 25px; line-height: 1.6; min-height: 100px;
            white-space: pre-wrap; display: flex; flex-direction: column;
        }
        .email-progress-container {
            width: 100%; height: 16px; border: 1px solid var(--crimson);
            background: rgba(255, 30, 70, 0.1); position: relative; margin-bottom: 10px;
            box-shadow: 0 0 15px rgba(255, 30, 70, 0.3);
        }
        .email-progress-bar {
            height: 100%; width: 0%; background: var(--crimson);
            box-shadow: 0 0 20px var(--crimson); transition: width 0.05s linear;
        }

        /* --- THE VIOLENT HACK TRANSITION (PIRATE REVEAL) --- */
        .hack-transition { animation: violent-shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes violent-shake {
            0% { transform: scale(0.9) translate(0, 0) skew(0deg); filter: hue-rotate(0deg) contrast(1); }
            20% { transform: scale(0.95) translate(-15px, 10px) skew(15deg); filter: hue-rotate(90deg) contrast(3) invert(1); box-shadow: -15px 0 30px var(--crimson), 15px 0 30px var(--cyan); }
            40% { transform: scale(0.85) translate(15px, -15px) skew(-15deg); filter: hue-rotate(180deg) contrast(4); }
            60% { transform: scale(1.05) translate(-10px, -5px) skew(5deg); filter: hue-rotate(270deg) contrast(2) invert(1); box-shadow: 0 -15px 40px var(--crimson); }
            80% { transform: scale(0.88) translate(10px, 10px) skew(-5deg); filter: hue-rotate(360deg) contrast(1.5); }
            100% { transform: scale(0.9) translate(0, 0) skew(0deg); filter: none; }
        }

        .email-header { display: flex; flex-direction: column; border-bottom: 1px dashed rgba(216, 132, 255, 0.4); padding-bottom: 15px; margin-bottom: 20px; }
        .email-meta { font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-muted); letter-spacing: 1px; line-height: 1.6; }
        .email-meta span { color: var(--bright-purple); font-weight: bold; }
        .email-subject { 
            font-family: var(--font-en); font-size: 1.5rem; font-weight: 900; color: #fff; 
            letter-spacing: 3px; margin-top: 10px; text-shadow: 0 0 10px rgba(216, 132, 255, 0.5); 
            animation: text-flicker 3s infinite;
        }

        @keyframes text-flicker {
            0%, 96%, 98%, 100% { opacity: 1; text-shadow: 0 0 10px rgba(216, 132, 255, 0.5); }
            97%, 99% { opacity: 0.8; text-shadow: -3px 0 var(--crimson), 3px 0 var(--cyan); }
        }
        
        .email-body { font-family: var(--font-mono); font-size: 0.9rem; color: #d4c8e5; line-height: 1.7; margin-bottom: 30px; position: relative; z-index: 15; }
        .email-body p { margin: 0 0 15px 0; }
        .highlight-temp { color: #fff; font-weight: bold; text-shadow: 0 0 8px rgba(255,255,255,0.4); }
        .highlight-threat { color: var(--crimson); font-weight: bold; text-shadow: 0 0 8px rgba(255,30,70,0.4); }

        .btn-purge-email {
            width: 100%; height: 65px;
            background: rgba(15, 5, 20, 0.85); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.05);
            color: var(--bright-purple); font-family: var(--font-en); font-size: 1.2rem; font-weight: 700;
            letter-spacing: 3px; cursor: pointer; transition: all 0.3s ease;
            text-transform: uppercase; position: relative; z-index: 15; overflow: hidden;
            text-shadow: 0 0 5px rgba(216, 132, 255, 0.5); display: flex; align-items: center; justify-content: center;
        }
        .btn-purge-email::before {
            content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
            background: var(--bright-purple); transition: all 0.3s ease; box-shadow: 0 0 15px var(--bright-purple);
        }
        .btn-purge-email:active, .btn-purge-email:hover {
            background: rgba(216, 132, 255, 0.15); color: #fff;
            transform: scale(0.96) translateY(-2px); text-shadow: 0 0 10px #fff;
            border-color: rgba(216, 132, 255, 0.4); box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .btn-purge-email:hover::before { width: 6px; }
    </style>
</head>
<body>

<!-- THE EVERY-TIME CRIMSON BOOTLOADER -->
<div id="bootScreen">
    <div class="boot-container">
        <div id="mainSyntaxTerminal"></div>
        <div class="boot-progress-container">
            <div class="boot-progress-bar" id="mainBootProgressBar"></div>
        </div>

    // --- The Main Crimson Bootloader (Runs EVERY TIME) ---

            { text: "> SYNCING NEURAL LINK...", color: "#ff4d6d" }

        term.innerHTML = '';
        let currentLine = 0;
        let currentChar = 0;

        // Custom typewriter effect
        function typeFastMain() {
            if (currentLine < lines.length) {
                if (currentChar === 0) {
                    term.innerHTML += `<div id="boot-line-${currentLine}" style="color: ${lines[currentLine].color}; text-shadow: 0 0 8px ${lines[currentLine].color}; margin-bottom: 4px;"></div>`;

                    currentChar = 0;
                    currentLine++;
                    setTimeout(typeFastMain, 100);

        }
        
        setTimeout(typeFastMain, 300);

        // Fill Progress Bar
        let prog = 0;
        const progInt = setInterval(() => {
            prog += Math.random() * 6 + 1;
            if (prog > 100) prog = 100;
            bar.style.width = prog + '%';
            
            if (prog === 100) {
                clearInterval(progInt);
                granted.style.opacity = '1';
                
                // Dissolve boot screen and check if briefing should run
                setTimeout(() => {
                    boot.classList.add('fade-out');
                    
                    const todayStr = new Date().toDateString();

                    if (lastBriefing !== todayStr) {
                        setTimeout(() => initiateAIBriefing(todayStr), 300);
                    } else {
                        setTimeout(showMainHub, 300);
                    }
                }, 1200);
            }
        }, 60);

    async function initiateAIBriefing(todayStr) {
        const now = new Date(); const hour = now.getHours(); const day = now.getDay(); const month = now.getMonth();
        const card = document.getElementById('aiEmailCard');

            let season = "Winter"; if (month >= 2 && month <= 4) season = "Spring"; else if (month >= 5 && month <= 7) season = "Summer"; else if (month >= 8 && month <= 10) season = "Autumn";

                const data = await res.json(); clearTimeout(timeoutId);

                <p style="color: var(--bright-purple);">> End of briefing.</p>

        const overlay = document.getElementById('aiEmailOverlay');

    function dismissAIEmail() {
        const card = document.getElementById('aiEmailCard');
        const headerDiv = document.getElementById('emailHeaderContainer');
        const bodyDiv = document.getElementById('aiEmailBody');

            card.classList.add('meltdown-transition');
            setTimeout(() => { card.classList.add('meltdown-active'); }, 50); 
            
            btn.innerText = "[ PROCESSING... ]";
            btn.style.pointerEvents = "none";

            // 2. Begin Gradient Hacking Sequence inside the Email
            setTimeout(() => {
                card.classList.remove('meltdown-transition'); 
                
                headerDiv.innerHTML = `<div class="email-subject" style="color: var(--crimson); text-align: center; text-shadow: 0 0 10px var(--crimson); letter-spacing: 5px;">[ SYSTEM OVERRIDE ]</div>`;
                
                bodyDiv.innerHTML = `
                    <div class="email-hack-ui" id="emailHackTerminal"></div>
                    <div class="email-progress-container">
                        <div class="email-progress-bar" id="emailHackBar"></div>
                    </div>
                `;
                btn.style.display = 'none';

                const term = document.getElementById('emailHackTerminal');
                const bar = document.getElementById('emailHackBar');
                
                const hackLines = [
                    { text: "> TERMINATING HR_BOT.EXE...", color: "#8a031a" },
                    { text: "> BYPASSING KERNEL...", color: "#c9102c" },
                    { text: "> DECRYPTING TRUE_DIRECTIVE.SH...", color: "#ff1e46" },
                    { text: "> OVERRIDING SYSTEM ACCESS...", color: "#ff758f" }
                ];
                
                term.innerHTML = '';
                let currentLine = 0;
                let currentChar = 0;
                
                function typeFastEmail() {
                    if (currentLine < hackLines.length) {
                        if (currentChar === 0) {
                            term.innerHTML += `<div id="email-line-${currentLine}" style="color: ${hackLines[currentLine].color}; text-shadow: 0 0 8px ${hackLines[currentLine].color}; margin-bottom: 4px;"></div>`;
                        }
                        
                        const lineDiv = document.getElementById(`email-line-${currentLine}`);
                        lineDiv.innerHTML += hackLines[currentLine].text.charAt(currentChar);
                        currentChar++;
                        
                        if (currentChar < hackLines[currentLine].text.length) {
                            setTimeout(typeFastEmail, Math.random() * 20 + 10);
                        } else {
                            currentChar = 0;
                            currentLine++;

                        }
                    }
                }
                typeFastEmail();

                let prog = 0;
                const progInt = setInterval(() => {
                    prog += Math.random() * 8 + 1;
                    if (prog > 100) prog = 100;
                    bar.style.width = prog + '%';
                    
                    if (prog === 100) {
                        clearInterval(progInt);
                        
                        // 3. The Pirate Reveal
                        setTimeout(() => {
                            mondayHackPhase = 2; // Fully hacked
                            card.classList.remove('corporate-theme', 'meltdown-active');
                            card.classList.add('hack-transition'); // Violent Shake
                            
                            setTimeout(() => card.classList.remove('hack-transition'), 500);

                            headerDiv.innerHTML = `
                                <div class="email-meta">FROM: <span style="color: var(--crimson);">CORSair PRIME</span></div>

                    }
                }, 80);

            }, 5000); // 5 seconds of turning red

        } else if (mondayHackPhase === 2 || mondayHackPhase === 0) {
            // Final Dismiss -> Glitches out the email, then reveals the Main Hub
            card.classList.remove('crt-boot-in'); 
            card.classList.add('glitch-crash');
            
            setTimeout(() => { 
                document.getElementById('aiEmailOverlay').style.display = 'none';

    // --- Cipher Effect for Buttons ---
    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*<>";
    function applyCipherEffect(elements, selector) {
        const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reducedMotion) return;

        elements.forEach(btn => {
            btn.addEventListener('mouseenter', event => {
                let iterations = 0; const targetText = btn.dataset.cipher; const textElement = btn.querySelector(selector);
                if(!textElement) return;
                clearInterval(btn.dataset.interval);
                btn.dataset.interval = setInterval(() => {
                    textElement.innerText = targetText.split("").map((letter, index) => {
                        if(index < iterations) return targetText[index]; return letters[Math.floor(Math.random() * letters.length)];
                    }).join("");
                    if(iterations >= targetText.length) clearInterval(btn.dataset.interval);
                    iterations += 1 / 2; 
                }, 20);
            });
        });
    }
    applyCipherEffect(document.querySelectorAll('.cipher-btn'), '.btn-title');
    applyCipherEffect(document.querySelectorAll('.cipher-sub'), '.sub-title');

    // --- Random Skull Glitch Effect ---
    function triggerRandomGlitch() {
        const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (document.hidden || reducedMotion) {
            setTimeout(triggerRandomGlitch, Math.random() * 7000 + 3000);
            return;
        }

        const mark = document.getElementById('jollyRoger');
        if(mark) {
            mark.classList.add('glitch-violent');
            setTimeout(() => { mark.classList.remove('glitch-violent'); }, 300);
        }
        setTimeout(triggerRandomGlitch, Math.random() * 7000 + 3000);
    }
    setTimeout(triggerRandomGlitch, 3000);

    // --- Threat Stream Optimization ---
    const stream = document.getElementById('streamContent');
    function generateHex() {
        let result = ''; const chars = 'ABCDEF0123456789';
        for (let i = 0; i < 8; i++) result += chars.charAt(Math.floor(Math.random() * chars.length)); return `0x${result}`;
    }
    setInterval(() => {
        if (document.hidden || !stream) return; 
        let currentText = stream.innerText;
        if (currentText.length > 80) currentText = "> EXTRACTING: "; 
        stream.innerText = currentText + " " + generateHex();
    }, 400); 

    function toggleLabRoutine() { document.getElementById('labWrapper').classList.toggle('open'); }

    // --- Performance Optimized Particle System ---
    const canvas = document.getElementById('particleCanvas'); 
    let ctx = null; if (canvas) ctx = canvas.getContext('2d', { alpha: false }); 
    let particlesArray = []; const MAX_PARTICLES = 90; 
    
    function initCanvas() { if(!canvas) return; canvas.width = window.innerWidth; canvas.height = window.innerHeight; initParticles(); }
    window.addEventListener('resize', initCanvas); 

    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height; 
            this.size = Math.random() * 1.5 + 0.2; 
            this.speedX = Math.random() * 0.4 - 0.2; this.speedY = Math.random() * -0.8 - 0.2; 
            const colors = ['rgba(255, 30, 70,', 'rgba(157, 0, 255,', 'rgba(200, 180, 240,']; 
            this.colorBase = colors[Math.floor(Math.random() * colors.length)]; 
            this.opacity = Math.random() * 0.4 + 0.05;
        }
        update() { this.x += this.speedX; this.y += this.speedY; if (this.y < 0) { this.y = canvas.height; this.x = Math.random() * canvas.width; } if (this.x < 0 || this.x > canvas.width) this.speedX = -this.speedX; }
        draw() { ctx.fillStyle = `${this.colorBase} ${this.opacity})`; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
    }

    function initParticles() { 
        particlesArray = []; if(!canvas) return;
        const numberOfParticles = Math.min(Math.floor((canvas.width * canvas.height) / 7000), MAX_PARTICLES); 
        for (let i = 0; i < numberOfParticles; i++) particlesArray.push(new Particle()); 
    }

    let lastTime = 0; const FPS = 30; const frameTime = 1000 / FPS;
    function animateParticles(time) { 
        requestAnimationFrame(animateParticles);
        if(!canvas || !ctx) return;
        const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (document.hidden || reducedMotion) return;
        if (time - lastTime < frameTime) return;
        lastTime = time;
        ctx.clearRect(0, 0, canvas.width, canvas.height); 
        for (let i = 0; i < particlesArray.length; i++) { particlesArray[i].update(); particlesArray[i].draw(); } 
    }
    
    if(canvas) { initCanvas(); requestAnimationFrame(animateParticles); }
</script>
