<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>NEURAL_OS // HUB</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+JP:wght@400;700;900&display=swap');

        :root {
            --cp-cyan: #00f0ff;
            --cp-pink: #ff0055;
            --cp-lime: #39ff14;
            --cp-dark: #050507;
            --font-en: 'Orbitron', sans-serif;
            --font-jp: 'Noto Sans JP', sans-serif;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; min-height: 100vh; 
            background-color: var(--cp-dark); color: white;
            display: flex; flex-direction: column; align-items: center; 
            overflow-x: hidden; position: relative;
        }

        /* Gritty Liberty City Cityscape Overlay */
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(5,5,7,0.8) 0%, rgba(5,5,7,0.95) 100%), 
                        url('https://images.unsplash.com/photo-1605806616949-1e87b487cb2a?q=80&w=2000&auto=format&fit=crop');
            background-size: cover; background-position: center; z-index: 1; pointer-events: none;
        }

        /* Animated TRON Floor Grid */
        .tron-grid {
            position: fixed; top: 40%; left: -50%; width: 200%; height: 120%;
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.4) 2px, transparent 2px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.4) 2px, transparent 2px);
            background-size: 50px 50px;
            transform: perspective(600px) rotateX(75deg);
            z-index: 2; pointer-events: none;
            animation: grid-scroll 2s linear infinite;
            box-shadow: inset 0 100px 150px var(--cp-dark); /* Fades grid into the horizon */
        }

        @keyframes grid-scroll {
            0% { background-position: 0 0; }
            100% { background-position: 0 50px; }
        }

        /* CRT Scanlines */
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 3px, 3px 100%; z-index: 20; pointer-events: none;
        }

        .hub-container {
            position: relative; z-index: 30; width: 100%; max-width: 420px;
            padding: 50px 20px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center;
        }

        .landing-title {
            color: var(--cp-cyan); font-family: var(--font-en);
            font-size: 2.5rem; font-weight: 900; letter-spacing: 3px; text-align: center; margin-bottom: 40px;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.8), 0 0 30px rgba(0, 240, 255, 0.4);
        }
        
        .landing-title .jp-text {
            display: block; font-family: var(--font-jp); font-size: 1.2rem; color: white;
            text-shadow: 0 0 10px white, 0 0 20px var(--cp-cyan); letter-spacing: 6px; margin-top: 5px;
        }

        /* TRON Glowing Buttons */
        .menu-btn {
            width: 100%; height: 120px; 
            background: rgba(0, 10, 15, 0.6); backdrop-filter: blur(8px); border: 2px solid var(--cp-cyan);
            color: white; font-family: var(--font-en); font-weight: 900; font-size: 1.5rem; letter-spacing: 2px;
            margin-bottom: 25px; position: relative; cursor: pointer;
            clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4), inset 0 0 20px rgba(0, 240, 255, 0.2); 
            transition: all 0.2s ease-in-out;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        
        .menu-btn:hover, .menu-btn:active { 
            background: rgba(0, 240, 255, 0.1); border-color: #fff;
            box-shadow: 0 0 30px var(--cp-cyan), inset 0 0 30px var(--cp-cyan); 
            text-shadow: 0 0 10px white; transform: scale(0.98); 
        }

        .menu-btn .jp-sub {
            font-family: var(--font-jp); font-size: 0.85rem; font-weight: 700; letter-spacing: 4px;
            color: var(--cp-pink); text-shadow: 0 0 10px var(--cp-pink); margin-top: 8px;
        }

        /* Pink Accent Lab Button */
        .btn-lab { border-color: var(--cp-pink); box-shadow: 0 0 15px rgba(255, 0, 85, 0.4), inset 0 0 20px rgba(255, 0, 85, 0.2); }
        .btn-lab:hover, .btn-lab:active {
            background: rgba(255, 0, 85, 0.1); border-color: #fff;
            box-shadow: 0 0 30px var(--cp-pink), inset 0 0 30px var(--cp-pink); 
        }
        .btn-lab .jp-sub { color: var(--cp-cyan); text-shadow: 0 0 10px var(--cp-cyan); }

        .sub-menu-container {
            width: 100%; display: none; flex-direction: column; gap: 15px; margin-bottom: 30px;
            animation: slideDown 0.3s ease-out forwards; transform-origin: top;
        }

        @keyframes slideDown {
            0% { opacity: 0; transform: scaleY(0); }
            100% { opacity: 1; transform: scaleY(1); }
        }

        .sub-menu-btn {
            width: 100%; height: 85px; 
            background: rgba(0, 10, 5, 0.7); backdrop-filter: blur(5px);
            border: 1px solid var(--cp-lime); border-left: 6px solid var(--cp-lime);
            color: white; font-family: var(--font-en); font-weight: 700; font-size: 1.1rem; letter-spacing: 1px;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.2); transition: all 0.2s; cursor: pointer;
            display: flex; flex-direction: column; justify-content: center; padding-left: 20px; text-align: left;
        }
        
        .sub-menu-btn:hover, .sub-menu-btn:active { 
            background: rgba(57, 255, 20, 0.15); box-shadow: 0 0 20px var(--cp-lime); border-color: #fff;
        }

        .sub-menu-btn .jp-sub {
            font-family: var(--font-jp); font-size: 0.75rem; color: var(--cp-lime); text-shadow: 0 0 8px var(--cp-lime); margin-top: 4px; letter-spacing: 2px;
        }
    </style>
</head>
<body>

<div class="tron-grid"></div>
<div class="scanlines"></div>

<div class="hub-container">
    <div class="landing-title">
        NEURAL_OS
        <span class="jp-text">メイン・ターミナル</span>
    </div>

    <button class="menu-btn" onclick="window.location.href='qrtrans.html'">
        [ QR TRANSLATOR ]
        <span class="jp-sub">データ変換</span>
    </button>

    <button class="menu-btn btn-lab" onclick="toggleLabRoutine()">
        [ LAB ROUTINE ]
        <span class="jp-sub">研究所ルーチン</span>
    </button>

    <div id="labSubMenu" class="sub-menu-container">
        <button class="sub-menu-btn" onclick="window.location.href='bridge.html?mode=T1'">
            > PROTOCOL T1: Tg MATCH
            <span class="jp-sub">Tg マッチ</span>
        </button>
        
        <button class="sub-menu-btn" onclick="window.location.href='bridge.html?mode=T2'">
            > PROTOCOL T2: JOINT MASS
            <span class="jp-sub">継手質量</span>
        </button>
        
        <button class="sub-menu-btn" onclick="window.location.href='bridge.html?mode=T3'">
            > PROTOCOL T3: THICKNESS
            <span class="jp-sub">厚さ測定</span>
        </button>
    </div>
</div>

<script>
    function toggleLabRoutine() {
        const sub = document.getElementById('labSubMenu');
        sub.style.display = (sub.style.display === 'none' || sub.style.display === '') ? 'flex' : 'none';
    }
</script>

</body>
</html>
